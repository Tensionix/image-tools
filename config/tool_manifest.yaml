        title_ru: "×2"
        description: "Make every picture of the Source twice as large on each side. A picture keeps its format and the density it states, so it prints larger by as much; a JPEG is written again at quality 92."
        description_ru: "Увеличить каждую картинку источника вдвое по каждой стороне. Картинка сохраняет формат и записанную плотность, поэтому и печатается во столько же раз крупнее; JPEG пишется заново с качеством 92."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["scale", "--percent", "200"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
