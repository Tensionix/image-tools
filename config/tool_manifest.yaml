      - id: exact_size
        title: "Exact size"
        title_ru: "Точный размер"
        description: "Bring every picture of the Source to an exact width and height in pixels: inside the box, the box filled with a background, the box covered with the overflow cut, or stretched. A picture keeps its format unless another is asked."
        description_ru: "Привести каждую картинку источника к точной ширине и высоте в пикселях: вписать, вписать с полями фона, заполнить с обрезкой лишнего или растянуть. Формат остаётся прежним, если не выбран другой."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: width
            type: "number"
            group: "parameters"
            label: "Width, px"
            label_ru: "Ширина, px"
            required: true
            default: 1920
            min: 1
            max: 30000
            step: 10
          - id: height
            type: "number"
            group: "parameters"
            label: "Height, px"
            label_ru: "Высота, px"
            required: true
            default: 1080
            min: 1
            max: 30000
            step: 10
          - id: mode
            type: "radio"
            group: "parameters"
            label: "How"
            label_ru: "Как"
            hint: "Fit: proportions kept, one side may be shorter. With margins: fitted and the rest filled with the background. Fill: the box covered, the overflow cut at the edges. Stretch: the proportions given up."
            hint_ru: "Вписать: пропорции сохраняются, одна сторона может выйти короче. С полями: вписать и заполнить остаток фоном. Заполнить: рамка закрыта целиком, лишнее срезается по краям. Растянуть: пропорции не сохраняются."
            default: "pad"
            options:
              - value: "fit"
                label: "Fit"
                label_ru: "Вписать"
              - value: "pad"
                label: "With margins"
                label_ru: "С полями"
              - value: "crop"
                label: "Fill"
                label_ru: "Заполнить"
              - value: "stretch"
                label: "Stretch"
                label_ru: "Растянуть"
          - id: background_mode
            type: "radio"
            group: "parameters"
            label: "Margins"
            label_ru: "Поля"
            default: "white"
            visible_if:
              field: "mode"
              equals: "pad"
            options:
              - value: "white"
                label: "White"
                label_ru: "Белые"
                swatch: "#ffffff"
              - value: "black"
                label: "Black"
                label_ru: "Чёрные"
                swatch: "#000000"
              - value: "transparent"
                label: "Transparent"
                label_ru: "Прозрачные"
              - value: "custom"
                label: "Custom"
                label_ru: "Свой цвет"
          - id: background_rgb
            type: "rgb_color"
            group: "parameters"
            label: "Own colour"
            label_ru: "Свой цвет"
            default: "255,255,255"
            visible_if:
              field: "background_mode"
              equals: "custom"
          - &sizing_algorithm_field
            id: algorithm
            type: "radio"
            group: "parameters"
            label: "Algorithm"
            label_ru: "Алгоритм"
            hint: "Lanczos: photographs. Bicubic: a softer compromise. Box: maps, plans, screenshots. Nearest: no new colours - pixel art and palettes; diagonals become steps."
            hint_ru: "Lanczos: фотографии. Bicubic: мягкий компромисс. Box: карты, планы, скриншоты. Nearest: без новых цветов - пиксельная графика и палитры; диагонали становятся ступенями."
            default: "lanczos"
            options:
              - value: "lanczos"
                label: "Lanczos"
                label_ru: "Lanczos"
              - value: "bicubic"
                label: "Bicubic"
                label_ru: "Bicubic"
              - value: "box"
                label: "Box"
                label_ru: "Box"
              - value: "nearest"
                label: "Nearest"
                label_ru: "Nearest"
          - *transform_to_field
          - &sizing_quality_field
            id: jpeg_quality
            type: "quality"
            group: "format"
            label: "Quality"
            label_ru: "Качество"
            hint: "For a JPEG and a WebP: a picture of another size is written again."
            hint_ru: "Для JPEG и WebP: картинка нового размера пишется заново."
            disabled_if:
              field: "to"
              not_contains_any: ["keep", "jpg", "webp"]
            default: 92
            options:
              - value: 85
                label: "85% quality"
                label_ru: "85% качества"
              - value: 92
                label: "92% quality"
                label_ru: "92% качества"
              - value: 95
                label: "95% quality"
                label_ru: "95% качества"
        parameters:
          fixed_args: ["exact-size"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--width": "width"
            "--height": "height"
            "--mode": "mode"
            "--algorithm": "algorithm"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
          composite_args:
            "--background":
              field: "background_mode"
              custom_if:
                field: "background_mode"
                equals: "custom"
              fields: ["background_r", "background_g", "background_b"]
              separator: ","
          defaults:
            input_path: "input"
            output_path: "output/exact_size"

      - id: quick_scale_a3
        title: "A4 → A3 · 141%"
        title_ru: "A4 → A3 · 141%"
        description: "Make every picture of the Source larger by 141.42 % - the step from A4 to A3 and from A3 to A2. A picture keeps its format and the density it states, so it prints larger by as much; a JPEG is written again at quality 92."
        description_ru: "Увеличить каждую картинку источника на 141,42 % - шаг от A4 к A3 и от A3 к A2. Картинка сохраняет формат и записанную плотность, поэтому и печатается во столько же раз крупнее; JPEG пишется заново с качеством 92."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["scale", "--percent", "141.42"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
          defaults:
            input_path: "input"
            output_path: "output/scale_a3"

      - id: quick_scale_x2
