tool:
  id: audion_image_tools
  name: "Audion Image Tools"
  category: "Image tools"
  version: "1.0.0"

paths:
  input: "input"
  output: "output"
  logs: "logs"
  report: "report"
  workspace: "workspace"
  config: "config"
  release: "release"

module_io_fields: &module_io_fields
  - id: input_path
    type: "folder"
    group: "source"
    label: "SOURCE"
    label_ru: "ИСТОЧНИК"
    hint: "Optional. Leave empty to use the command default input folder."
    hint_ru: "Необязательно. Оставь пустым, чтобы использовать стандартную папку input для команды."
    placeholder: "input"
    default: ""
    omit_if_empty: true
  - id: output_path
    type: "folder"
    group: "output"
    label: "DESTINATION"
    label_ru: "ПРИЁМНИК"
    hint: "Optional. Leave empty to use the command default output folder."
    hint_ru: "Необязательно. Оставь пустым, чтобы использовать стандартную папку output для команды."
    placeholder: "output"
    default: ""
    omit_if_empty: true
    show_new_folder_button: true

delivery_format_options: &delivery_format_options
  - value: "jpg"
    label: "JPG"
    label_ru: "JPG"
  - value: "png"
    label: "PNG"
    label_ru: "PNG"
  - value: "tiff"
    label: "TIFF"
    label_ru: "TIFF"
  - value: "webp"
    label: "WebP"
    label_ru: "WebP"
  - value: "avif"
    label: "AVIF"
    label_ru: "AVIF"
  - value: "heif"
    label: "HEIF"
    label_ru: "HEIF"
  - value: "heic"
    label: "HEIC"
    label_ru: "HEIC"

extract_format_options: &extract_format_options
  - value: "original"
    label: "Original"
    label_ru: "Исходный формат"
  - value: "jpg"
    label: "JPG"
    label_ru: "JPG"
    new_row: true
  - value: "png"
    label: "PNG"
    label_ru: "PNG"
  - value: "tiff"
    label: "TIFF"
    label_ru: "TIFF"
  - value: "webp"
    label: "WebP"
    label_ru: "WebP"
  - value: "avif"
    label: "AVIF"
    label_ru: "AVIF"
  - value: "heif"
    label: "HEIF"
    label_ru: "HEIF"
  - value: "heic"
    label: "HEIC"
    label_ru: "HEIC"

pixel_dpi_format_options: &pixel_dpi_format_options
  - value: "jpg"
    label: "JPG"
    label_ru: "JPG"
  - value: "png"
    label: "PNG"
    label_ru: "PNG"
  - value: "tiff"
    label: "TIFF"
    label_ru: "TIFF"

quality_output_formats: &quality_output_formats ["jpg", "webp", "avif", "heif", "heic"]
dpi_metadata_output_formats: &dpi_metadata_output_formats ["jpg", "png", "tiff"]

quality_field_75: &quality_field_75
  id: jpeg_quality
  type: "quality"
  group: "format"
  label: "Quality"
  label_ru: "Качество"
  span: "full"
  disabled_if:
    field: "to"
    not_contains_any: *quality_output_formats
  default: 75
  options:
    - value: 60
      label: "60% quality"
      label_ru: "60% качества"
    - value: 75
      label: "75% quality"
      label_ru: "75% качества"
    - value: 90
      label: "90% quality"
      label_ru: "90% качества"

quality_field_90: &quality_field_90
  id: jpeg_quality
  type: "quality"
  group: "format"
  label: "Quality"
  label_ru: "Качество"
  span: "full"
  disabled_if:
    field: "to"
    not_contains_any: *quality_output_formats
  default: 90
  options:
    - value: 60
      label: "60% quality"
      label_ru: "60% качества"
    - value: 75
      label: "75% quality"
      label_ru: "75% качества"
    - value: 90
      label: "90% quality"
      label_ru: "90% качества"

quality_field_92: &quality_field_92
  id: jpeg_quality
  type: "quality"
  group: "format"
  label: "Quality"
  label_ru: "Качество"
  span: "full"
  disabled_if:
    field: "to"
    not_contains_any: *quality_output_formats
  default: 92
  options:
    - value: 75
      label: "75% quality"
      label_ru: "75% качества"
    - value: 92
      label: "92% quality"
      label_ru: "92% качества"

ui:
  title: "Audion Image Tools"
  host: "127.0.0.1"
  port: 8080
  native: false
  reload: false
  open_browser: false

operations:
  - id: info
    title: "Project info"
    title_ru: "Информация о проекте"
    description: "Show project paths and runtime information."
    description_ru: "Показать пути проекта и информацию о runtime."
    service: "system_core.services.image_tools_gui:run_cli_command"
    kind: "safe"
    parameters:
      args: ["info"]

operation_groups:
  - id: convert
    title: "Conversion"
    title_ru: "Конвертация"
    description: "Batch conversion for everyday format changes: JPG/PNG/TIFF/WebP/AVIF/HEIC, quality, DPI metadata and quick one-click presets."
    description_ru: "Пакетный перевод изображений между JPG/PNG/TIFF/WebP/AVIF/HEIC: качество, запись DPI, несколько форматов за один запуск и быстрые пресеты."
    fields: *module_io_fields
    children:
      - id: convert_images
        title: "Convert images"
        title_ru: "Конвертировать"
        description: "Convert input to selected output formats."
        description_ru: "Конвертировать папку в выбранные форматы."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: to
            type: "checkboxes"
            group: "format"
            label: "Output formats"
            label_ru: "Форматы вывода"
            default: ["jpg"]
            min_selected: 1
            options:
              - value: "jpg"
                label: "JPG"
                label_ru: "JPG"
              - value: "png"
                label: "PNG"
                label_ru: "PNG"
              - value: "tiff"
                label: "TIFF"
                label_ru: "TIFF"
              - value: "webp"
                label: "WebP"
                label_ru: "WebP"
              - value: "avif"
                label: "AVIF"
                label_ru: "AVIF"
              - value: "heif"
                label: "HEIF"
                label_ru: "HEIF"
              - value: "heic"
                label: "HEIC"
                label_ru: "HEIC"
              - value: "ico"
                label: "ICO"
                label_ru: "ICO"
                hint: "A Windows icon: the picture in a square with transparent margins, sizes 16 to 256 inside."
                hint_ru: "Значок Windows: картинка в квадрате с прозрачными полями, внутри размеры от 16 до 256."
          - id: jpeg_quality
            type: "quality"
            group: "format"
            label: "Quality"
            label_ru: "Качество"
            disabled_if:
              field: "to"
              not_contains_any: *quality_output_formats
            default: 83
            min: 1
            max: 100
            step: 1
            options:
              - value: 60
                label: "60%"
                label_ru: "60%"
              - value: 75
                label: "75%"
                label_ru: "75%"
              - value: 90
                label: "90%"
                label_ru: "90%"
          - id: set_dpi
            type: "number"
            group: "output"
            label: "Set DPI (optional)"
            label_ru: "Записать DPI (необязательно)"
            hint: "Leave empty to preserve existing metadata."
            hint_ru: "Оставь пустым, чтобы сохранить существующие метаданные."
            disabled_if:
              field: "to"
              not_contains_any: *dpi_metadata_output_formats
            default: ""
            min: 1
            max: 1200
            step: 1
          - id: png_preset
            type: "radio"
            group: "format"
            label: "PNG compression"
            label_ru: "Сжатие PNG"
            hint: "Without loss whatever is chosen: stronger - a smaller file written longer."
            hint_ru: "Без потерь при любом выборе: сильнее - файл меньше, пишется дольше."
            disabled_if:
              field: "to"
              not_contains_any: ["png"]
            default: "balanced"
            options:
              - value: "fast"
                label: "Fast"
                label_ru: "Быстро"
              - value: "balanced"
                label: "Usual"
                label_ru: "Обычно"
              - value: "small"
                label: "Stronger"
                label_ru: "Сильнее"
          - id: alpha_bg
            type: "radio"
            group: "format"
            label: "Background under transparency"
            label_ru: "Фон под прозрачность"
            hint: "What the transparent parts are laid on in a format that keeps no transparency here: JPG, WebP, AVIF, HEIC."
            hint_ru: "На что ложатся прозрачные места в форматах, которые здесь прозрачность не хранят: JPG, WebP, AVIF, HEIC."
            disabled_if:
              field: "to"
              not_contains_any: *quality_output_formats
            default: "white"
            options:
              - value: "white"
                label: "White"
                label_ru: "Белый"
                swatch: "#ffffff"
              - value: "black"
                label: "Black"
                label_ru: "Чёрный"
                swatch: "#000000"
              - value: "custom"
                label: "Custom"
                label_ru: "Свой"
          - id: alpha_rgb
            type: "rgb_color"
            group: "format"
            label: "Own background"
            label_ru: "Свой фон"
            default: "255,255,255"
            visible_if:
              field: "alpha_bg"
              equals: "custom"
          - &metadata_field
            id: metadata
            type: "radio"
            group: "options"
            label: "Metadata"
            label_ru: "Метаданные"
            hint: "DPI + colour: the density and the colour profile stay, EXIF goes - with GPS, the camera and the date. Preserve all: EXIF stays too. Strip all: the profile and the density go as well."
            hint_ru: "DPI + цвет: остаются плотность и цветовой профиль, EXIF уходит - с GPS, камерой и датой. Сохранить всё: остаётся и EXIF. Удалить всё: уходят и профиль, и плотность."
            default: "preserve_dpi_color"
            options:
              - value: "preserve_dpi_color"
                label: "DPI + color"
                label_ru: "DPI + цвет"
              - value: "preserve_all"
                label: "Preserve all"
                label_ru: "Сохранить всё"
              - value: "strip_all"
                label: "Strip all"
                label_ru: "Удалить всё"
        parameters:
          fixed_args: ["convert"]
          multi_field: "to"
          multi_output_key: "output_path"
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
            "--set-dpi": "set_dpi"
            "--png-preset": "png_preset"
            "--metadata": "metadata"
          composite_args:
            "--alpha-bg":
              field: "alpha_bg"
              custom_if:
                field: "alpha_bg"
                equals: "custom"
              fields: ["bg_r", "bg_g", "bg_b"]
              separator: ","
          defaults:
            input_path: "input"
            output_path: "output"

      - id: frames_to_animation
        title: "Animation from frames"
        title_ru: "Анимация из кадров"
        description: "Put the pictures of a folder of the Source together into one GIF, WebP or APNG, in the order of their names (2 before 10), named after the folder; a folder of such folders gives one animation a folder. The pauses come from frames.json when Split into frames left it there. A frame of another size is fitted into the size of the first."
        description_ru: "Собрать картинки папки источника в один GIF, WebP или APNG, в порядке имён (2 раньше 10), с именем папки; папка таких папок даёт по анимации на папку. Паузы берутся из frames.json, если его оставил «Разделить на кадры». Кадр другого размера вписывается в размер первого."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: to
            type: "radio"
            group: "format"
            label: "Animation"
            label_ru: "Анимация"
            default: "gif"
            options:
              - value: "gif"
                label: "GIF"
                label_ru: "GIF"
              - value: "webp"
                label: "WebP"
                label_ru: "WebP"
              - value: "apng"
                label: "APNG"
                label_ru: "APNG"
          - id: quality
            type: "quality"
            group: "format"
            label: "WebP quality"
            label_ru: "Качество WebP"
            hint: "100 - without loss."
            hint_ru: "100 - без потерь."
            disabled_if:
              field: "to"
              not_equals: "webp"
            default: 90
            options:
              - value: 80
                label: "80%"
                label_ru: "80%"
              - value: 90
                label: "90%"
                label_ru: "90%"
              - value: 100
                label: "Without loss"
                label_ru: "Без потерь"
          - id: timing
            type: "radio"
            group: "parameters"
            label: "Pauses"
            label_ru: "Паузы"
            hint: "From frames.json - as the animation that was taken apart had them; where there is no file, the frames a second count."
            hint_ru: "Из frames.json - как были у разобранной анимации; где файла нет, считаются кадры в секунду."
            default: "file"
            options:
              - value: "file"
                label: "From frames.json"
                label_ru: "Из frames.json"
              - value: "fps"
                label: "By frames a second"
                label_ru: "По частоте"
          - id: fps
            type: "number"
            group: "parameters"
            label: "Frames a second"
            label_ru: "Кадров в секунду"
            default: 10
            min: 1
            max: 60
            step: 1
          - id: loop
            type: "radio"
            group: "parameters"
            label: "Plays"
            label_ru: "Повтор"
            default: "0"
            options:
              - value: "0"
                label: "Endless"
                label_ru: "Бесконечно"
              - value: "1"
                label: "Once"
                label_ru: "Один раз"
        parameters:
          fixed_args: ["frames-to-animation"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--quality": "quality"
            "--timing": "timing"
            "--fps": "fps"
            "--loop": "loop"
          defaults:
            input_path: "input"
            output_path: "output/animation"

      - id: quick_jpg_75
        title: "JPG 75% quality"
        title_ru: "JPG 75% качества"
        description: "Convert input to JPG at 75% quality."
        description_ru: "Конвертировать папку в JPG, 75% качества."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["convert"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
          defaults:
            input_path: "input"
            output_path: "output/quick_jpg_75"
            to: "jpg"
            jpeg_quality: 75

      - id: quick_png
        title: "PNG"
        title_ru: "PNG"
        description: "Convert input to PNG."
        description_ru: "Конвертировать папку в PNG."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["convert"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
          defaults:
            input_path: "input"
            output_path: "output/quick_png"
            to: "png"

      - id: quick_gray_png
        title: "Grayscale PNG"
        title_ru: "PNG в оттенках серого"
        description: "Convert input to grayscale PNG."
        description_ru: "Перевести папку в PNG в оттенках серого."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["grayscale"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
          defaults:
            input_path: "input"
            output_path: "output/gray_png"
            to: "png"

      - id: quick_2160_jpg
        title: "2160p JPG 90% quality"
        title_ru: "2160p JPG 90% качества"
        description: "Fit to UHD 3840x2160 with center crop and save JPG at 90% quality. Uses Lanczos resize; actual UHD upscale gets a mild Unsharp Mask."
        description_ru: "Подогнать под UHD 3840x2160 с центральной обрезкой и сохранить JPG 90%. Используется Lanczos; при реальном апскейле до UHD применяется мягкая Unsharp Mask."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["resize-screen"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--target": "target"
            "--mode": "mode"
            "--jpeg-quality": "jpeg_quality"
          defaults:
            input_path: "input"
            output_path: "output/screen_2160p_crop_jpg"
            to: "jpg"
            target: "2160p"
            mode: "crop"
            jpeg_quality: 90

      - id: quick_169_jpg
        title: "16:9 JPG 90% quality"
        title_ru: "16:9 JPG 90% качества"
        description: "Crop to 16:9 and save JPG at 90% quality."
        description_ru: "Обрезать под 16:9 и сохранить JPG, 90% качества."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["aspect"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--ratio": "ratio"
            "--mode": "mode"
            "--jpeg-quality": "jpeg_quality"
          defaults:
            input_path: "input"
            output_path: "output/aspect_16x9_crop_jpg"
            to: "jpg"
            ratio: "16:9"
            mode: "crop"
            jpeg_quality: 90

  - id: photo_sheet
    title: "Photo sheet"
    title_ru: "Фото-лист"
    description: "Prepare printable sheets from source images without resampling pixels by default; final width and DPI describe the output sheet."
    description_ru: "Подготовка печатных листов из исходных картинок без пересчёта пикселей по умолчанию; ширина и DPI описывают итоговый лист."
    fields:
      - id: input_path
        type: "folder"
        group: "source"
        label: "SOURCE"
        label_ru: "ИСТОЧНИК"
        hint: "Optional. Leave empty to use the input folder from config/photo_sheet.yaml."
        hint_ru: "Необязательно. Оставь пустым, чтобы взять input из config/photo_sheet.yaml."
        placeholder: "input"
        default: ""
        omit_if_empty: true
      - id: output_path
        type: "folder"
        group: "output"
        label: "DESTINATION"
        label_ru: "ПРИЁМНИК"
        hint: "Optional. Leave empty to use the output folder from config/photo_sheet.yaml."
        hint_ru: "Необязательно. Оставь пустым, чтобы взять output из config/photo_sheet.yaml."
        placeholder: "output"
        default: ""
        omit_if_empty: true
        show_new_folder_button: true
      - id: page_width_mm
        type: "number"
        group: "output"
        label: "Sheet width, mm"
        label_ru: "Ширина листа, мм"
        hint: "Final sheet width. Height is calculated automatically. Source pixels stay unchanged in the default mode."
        hint_ru: "Итоговая ширина листа. Высота считается автоматически. В дефолтном режиме пиксели исходников не меняются."
        default: 600
        min: 1
        max: 10000
        step: 1
      - id: dpi
        type: "number"
        group: "output"
        label: "Final DPI"
        label_ru: "Конечный DPI"
        hint: "Output sheet DPI. If unchanged source pixels do not fit the selected width, the engine can raise the sheet DPI instead of resizing images."
        hint_ru: "DPI итогового листа. Если исходные пиксели не помещаются в выбранную ширину, движок поднимет DPI листа вместо resize картинок."
        default: 300
        min: 72
        max: 1200
        step: 1
      - id: recursive
        type: "checkbox"
        group: "options"
        label: "Read input recursively"
        label_ru: "Читать вложенные папки"
        hint: "Enabled by default: subfolders are mirrored into output."
        hint_ru: "Включено по умолчанию: подпапки зеркалятся в output."
        default: true
      - id: background
        type: "radio"
        group: "options"
        label: "Background"
        label_ru: "Фон"
        default: "white"
        options:
          - value: "white"
            label: "White"
            label_ru: "Белый"
          - value: "black"
            label: "Black"
            label_ru: "Чёрный"
      - id: to
        type: "radio"
        group: "format"
        label: "Output format"
        label_ru: "Формат вывода"
        default: "png"
        options: *delivery_format_options
      - *quality_field_90
    children:
      - id: paper_saver
        title: "Paper saver"
        title_ru: "Экономия бумаги"
        description: "Compact no-gap line layout."
        description_ru: "Компактная раскладка строками без зазоров."
        service: "system_core.services.image_tools_gui:run_photo_sheet"
        kind: "safe"
        parameters:
          config_mode: "paper_saver"

      - id: cut_lines
        title: "Cut-lines"
        title_ru: "Быстрая резка"
        description: "Group by similar heights and write cut_plan.txt."
        description_ru: "Группировать по похожей высоте и записать cut_plan.txt."
        service: "system_core.services.image_tools_gui:run_photo_sheet"
        kind: "safe"
        parameters:
          config_mode: "cut_lines"
        fields:
          - id: height_tolerance_mm
            type: "number"
            group: "options"
            label: "Height tolerance, mm"
            label_ru: "Допуск высоты, мм"
            hint: "Larger values make fewer strips but less exact shared cut lines."
            hint_ru: "Больше значение — меньше полос, но менее точные общие линии реза."
            default: 0.2
            min: 0
            max: 20
            step: 0.1

  - id: color
    title: "Color"
    title_ru: "Цвет"
    description: "Normalize color profiles before delivery or print: keep source color, convert to sRGB/CMYK, and choose what metadata should remain."
    description_ru: "Подготовка цвета перед публикацией или печатью: оставить исходный профиль, привести к sRGB/CMYK и выбрать, какие метаданные сохранить."
    fields: *module_io_fields
    children:
      - id: normalize_profile
        title: "Normalize profile"
        title_ru: "Нормализовать профиль"
        description: "Normalize to keep, sRGB or CMYK."
        description_ru: "Сохранить исходный профиль или привести к sRGB/CMYK."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: target_profile
            type: "radio"
            group: "format"
            label: "Target profile"
            label_ru: "Целевой профиль"
            default: "srgb"
            options:
              - value: "keep"
                label: "Keep"
                label_ru: "Оставить"
              - value: "srgb"
                label: "sRGB"
                label_ru: "sRGB"
              - value: "cmyk"
                label: "CMYK"
                label_ru: "CMYK"
          - id: to
            type: "checkboxes"
            group: "format"
            label: "Output formats"
            label_ru: "Форматы вывода"
            default: ["jpg"]
            min_selected: 1
            options: *delivery_format_options
          - *quality_field_75
          - *metadata_field
          - id: srgb_profile_mode
            type: "radio"
            group: "advanced"
            label: "sRGB profile"
            label_ru: "Профиль sRGB"
            default: "colororg"
            visible_if:
              field: "target_profile"
              equals: "srgb"
            options:
              - value: "colororg"
                label: "sRGB 2014 (color.org)"
                label_ru: "sRGB 2014 (color.org)"
              - value: "pillow"
                label: "Built into Pillow"
                label_ru: "Встроенный Pillow"
          - id: cmyk_profile
            type: "radio"
            group: "advanced"
            label: "CMYK profile"
            label_ru: "Профиль CMYK"
            hint: "Photoshop 5 - the usual default; Coated FOGRA39 - offset on coated paper, the European standard."
            hint_ru: "Photoshop 5 - обычный по умолчанию; Coated FOGRA39 - офсет на мелованной бумаге, европейский стандарт."
            default: "config/icc/Photoshop5DefaultCMYK.icc"
            visible_if:
              field: "target_profile"
              equals: "cmyk"
            options:
              - value: "config/icc/Photoshop5DefaultCMYK.icc"
                label: "Photoshop 5"
                label_ru: "Photoshop 5"
              - value: "config/icc/CoatedFOGRA39.icc"
                label: "Coated FOGRA39"
                label_ru: "Coated FOGRA39"
        parameters:
          fixed_args: ["normalize"]
          multi_field: "to"
          multi_output_key: "output_path"
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
            "--target-profile": "target_profile"
            "--metadata": "metadata"
            "--srgb-profile-mode": "srgb_profile_mode"
            "--cmyk-profile": "cmyk_profile"
          defaults:
            input_path: "input"
            output_path: "output"

      - id: color_adjust
        title: "Correction"
        title_ru: "Коррекция"
        description: "Correct the colour of every picture of the Source: the levels stretched, brightness, contrast, saturation, gamma, a tone - grey, sepia or a tint - the inversion, and white made transparent. The transparency of a picture is kept. A picture keeps its format; one whose white became transparent and that was a JPEG is written as a PNG."
        description_ru: "Поправить цвет каждой картинки источника: растянуть уровни, яркость, контраст, насыщенность, гамма, тон - ч/б, сепия или тонировка, - инверсия и белое в прозрачное. Прозрачность картинки сохраняется. Формат остаётся прежним; JPEG, у которого белое стало прозрачным, пишется в PNG."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: levels
            type: "radio"
            group: "parameters"
            label: "Auto levels"
            label_ru: "Автоуровни"
            hint: "By channels: every channel stretched apart - a cast of colour goes. With the tone: stretched together - the tone of the picture kept."
            hint_ru: "По каналам: каждый канал растягивается отдельно - уходит цветной налёт. С тоном: растягиваются вместе - тон картинки сохраняется."
            default: "none"
            options:
              - value: "none"
                label: "No"
                label_ru: "Нет"
              - value: "channels"
                label: "By channels"
                label_ru: "По каналам"
              - value: "tone"
                label: "With the tone"
                label_ru: "С тоном"
          - id: cutoff
            type: "number"
            group: "parameters"
            label: "Left out, %"
            label_ru: "Отсечь, %"
            hint: "Percent of the darkest and the lightest pixels left out of the stretch: a speck of dust does not set the levels."
            hint_ru: "Процент самых тёмных и самых светлых пикселей, которые не участвуют: пылинка не задаёт уровни."
            default: 0.5
            min: 0
            max: 5
            step: 0.1
            visible_if:
              field: "levels"
              not_equals: "none"
          - id: brightness
            type: "slider"
            group: "parameters"
            label: "Brightness"
            label_ru: "Яркость"
            track: ["#000000", "#ffffff"]
            default: 0
            min: -100
            max: 100
            step: 1
          - id: contrast
            type: "slider"
            group: "parameters"
            label: "Contrast"
            label_ru: "Контраст"
            track: ["#808080", "#808080", "#000000", "#ffffff"]
            default: 0
            min: -100
            max: 100
            step: 1
          - id: saturation
            type: "slider"
            group: "parameters"
            label: "Saturation"
            label_ru: "Насыщенность"
            track: ["#808080", "#ff3b30", "#ffcc00", "#34c759", "#007aff"]
            default: 0
            min: -100
            max: 100
            step: 1
          - id: gamma
            type: "slider"
            group: "parameters"
            label: "Gamma"
            label_ru: "Гамма"
            track: ["#000000", "#404040", "#c0c0c0", "#ffffff"]
            default: 1
            min: 0.2
            max: 3
            step: 0.05
          - id: tone
            type: "radio"
            group: "parameters"
            label: "Tone"
            label_ru: "Тон"
            default: "keep"
            options:
              - value: "keep"
                label: "As it is"
                label_ru: "Как есть"
              - value: "gray"
                label: "Black and white"
                label_ru: "Ч/б"
                tone: "gray"
              - value: "sepia"
                label: "Sepia"
                label_ru: "Сепия"
                tone: "sepia"
              - value: "tint"
                label: "Tint"
                label_ru: "Тонировать"
                tone: "tint"
          - id: tone_rgb
            type: "rgb_color"
            group: "parameters"
            label: "Colour of the tint"
            label_ru: "Цвет тонировки"
            default: "40,110,180"
            visible_if:
              field: "tone"
              equals: "tint"
          - id: invert
            type: "checkbox"
            group: "parameters"
            label: "Invert"
            label_ru: "Инвертировать"
            default: false
          - id: white_transparent
            type: "checkbox"
            group: "parameters"
            label: "White to transparent"
            label_ru: "Белое в прозрачное"
            hint: "The near-white goes transparent, with a soft edge: a stamp, a signature, a drawing on white paper over another picture."
            hint_ru: "Почти белое становится прозрачным, с мягким краем: печать, подпись, рисунок на белой бумаге поверх другой картинки."
            default: false
          - id: tolerance
            type: "slider"
            group: "parameters"
            label: "Still white, %"
            label_ru: "Ещё белое, %"
            track: ["#ffffff", "#808080"]
            default: 8
            min: 0
            max: 60
            step: 1
            visible_if:
              field: "white_transparent"
              equals: true
          - id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "keep"
            options:
              - value: "keep"
                label: "As the source"
                label_ru: "Как у исходника"
              - value: "jpg"
                label: "JPG"
                label_ru: "JPG"
              - value: "png"
                label: "PNG"
                label_ru: "PNG"
              - value: "tiff"
                label: "TIFF"
                label_ru: "TIFF"
              - value: "webp"
                label: "WebP"
                label_ru: "WebP"
          - id: jpeg_quality
            type: "quality"
            group: "format"
            label: "Quality"
            label_ru: "Качество"
            hint: "For a JPEG and a WebP: a corrected picture is written again."
            hint_ru: "Для JPEG и WebP: поправленная картинка пишется заново."
            disabled_if:
              field: "to"
              not_contains_any: ["keep", "jpg", "webp"]
            default: 95
            options:
              - value: 90
                label: "90% quality"
                label_ru: "90% качества"
              - value: 95
                label: "95% quality"
                label_ru: "95% качества"
        parameters:
          fixed_args: ["adjust"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--levels": "levels"
            "--cutoff": "cutoff"
            "--brightness": "brightness"
            "--contrast": "contrast"
            "--saturation": "saturation"
            "--gamma": "gamma"
            "--tolerance": "tolerance"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
          flag_args:
            "--invert": "invert"
            "--white-transparent": "white_transparent"
          composite_args:
            "--tone":
              field: "tone"
              custom_if:
                field: "tone"
                equals: "tint"
              fields: ["tone_r", "tone_g", "tone_b"]
              separator: ","
          defaults:
            input_path: "input"
            output_path: "output/adjust"

      - id: png_palette
        title: "PNG 256 colours"
        title_ru: "PNG 256 цветов"
        description: "Write every picture of the Source as a PNG of at most so many colours: drawings, plans, maps, screenshots, CAD - many times lighter without a visible change. A transparent picture keeps its transparency."
        description_ru: "Записать каждую картинку источника в PNG не больше чем из стольких цветов: чертежи, планы, карты, скриншоты, CAD - во много раз легче без видимой разницы. Прозрачная картинка сохраняет прозрачность."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: colors
            type: "slider"
            group: "parameters"
            label: "Colours"
            label_ru: "Цветов"
            track: ["#606060", "#ff3b30", "#ff9500", "#ffcc00", "#34c759", "#007aff", "#af52de"]
            default: 256
            min: 2
            max: 256
            step: 1
          - id: dither
            type: "radio"
            group: "parameters"
            label: "Dithering"
            label_ru: "Растр"
            hint: "Off - drawings and plans: clean edges, the lightest file. On - photographs: smooth transitions."
            hint_ru: "Выкл - чертежи и планы: чистые края, самый лёгкий файл. Вкл - фотографии: плавные переходы."
            default: "off"
            options:
              - value: "off"
                label: "Off"
                label_ru: "Выкл"
              - value: "on"
                label: "On"
                label_ru: "Вкл"
          - id: method
            type: "radio"
            group: "parameters"
            label: "Colours chosen by"
            label_ru: "Подбор цветов"
            default: "mediancut"
            options:
              - value: "mediancut"
                label: "Median cut"
                label_ru: "Медианное сечение"
              - value: "maxcoverage"
                label: "Most coverage"
                label_ru: "Наибольший охват"
              - value: "octree"
                label: "Octree"
                label_ru: "Октодерево"
        parameters:
          fixed_args: ["palette"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--colors": "colors"
            "--dither": "dither"
            "--method": "method"
          defaults:
            input_path: "input"
            output_path: "output/png_palette"

      - id: quick_auto_levels
        title: "Auto levels"
        title_ru: "Автоуровни"
        description: "Stretch the levels of every picture of the Source by channels, leaving out half a percent at both ends: a dull scan or a cast of colour goes. A picture keeps its format; a JPEG is written again at quality 95."
        description_ru: "Растянуть уровни каждой картинки источника по каналам, отсекая по полпроцента с краёв: уходят тусклость скана и цветной налёт. Формат остаётся прежним; JPEG пишется заново с качеством 95."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["adjust", "--levels", "channels"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
          defaults:
            input_path: "input"
            output_path: "output/auto_levels"

      - id: quick_png_256
        title: "PNG 256"
        title_ru: "PNG 256"
        description: "Write every picture of the Source as a PNG of 256 colours, without dithering: drawings, plans, CAD many times lighter."
        description_ru: "Записать каждую картинку источника в PNG из 256 цветов, без растра: чертежи, планы, CAD во много раз легче."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["palette", "--colors", "256"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
          defaults:
            input_path: "input"
            output_path: "output/png_256"

      - id: quick_strip_meta
        title: "No EXIF and GPS"
        title_ru: "Без EXIF и GPS"
        description: "Copy every JPEG, PNG and WebP of the Source into the Target without what it tells about itself: EXIF with GPS, the camera, the date and the thumbnail, XMP, IPTC, comments, the pictures a phone writes after the photograph. The picture itself is not written again - the copy decodes into the same pixels, which is checked; the colour profile, the density and the turn of a photograph stay. Another format is named and passed by: Convert with DPI + colour leaves no EXIF."
        description_ru: "Скопировать каждый JPEG, PNG и WebP источника в назначение без того, что файл рассказывает о себе: EXIF с GPS, камерой, датой и миниатюрой, XMP, IPTC, комментариев, картинок, которые телефон пишет после снимка. Сама картинка не переписывается - копия даёт те же пиксели, это проверяется; цветовой профиль, плотность и поворот снимка остаются. Другой формат назван и пропущен: «Конвертировать» с «DPI + цвет» EXIF не оставляет."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["strip-meta"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
          defaults:
            input_path: "input"
            output_path: "output/no_exif"

  - id: crop
    title: "Transform"
    title_ru: "Трансформация"
    description: "Crop cleanup tools: remove solid borders, trim white fields to content, add safety margins, or split images into strips and grids."
    description_ru: "Инструменты обрезки: убрать однотонные рамки, обрезать белые поля до содержимого, добавить защитный запас или разрезать изображение на ленты и сетку."
    fields: *module_io_fields
    children:
      - id: trim_border
        title: "Trim border"
        title_ru: "Обрезать рамку"
        description: "Trim solid border by corner color."
        description_ru: "Обрезать однотонную рамку по угловому цвету."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: tolerance
            type: "number"
            group: "parameters"
            label: "Tolerance"
            label_ru: "Допуск"
            default: 10
            min: 0
            max: 255
            step: 1
          - id: safety_margin_mm
            type: "number"
            group: "parameters"
            label: "Safety margin, mm"
            label_ru: "Защитное поле, мм"
            hint: "0 mm crops exactly to the meaningful pixels. Larger values use image DPI, fallback 300 DPI."
            hint_ru: "0 мм — ровно по значимым пикселям. Больше — запас по DPI изображения, если DPI нет — 300."
            default: 0
            min: 0
            max: 50
            step: 0.1
          - id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "png"
            options: *delivery_format_options
          - *quality_field_75
          - id: pdf_after_crop
            type: "checkbox"
            group: "output"
            label: "Build PDF after crop"
            label_ru: "Собрать PDF после обрезки"
            hint: "Keeps pixels unchanged. PDF page size comes from result image DPI."
            hint_ru: "Пиксели не меняются. Размер страниц PDF берётся из DPI результата."
            default: false
          - id: pdf_embed_mode
            type: "radio"
            group: "output"
            label: "PDF content"
            label_ru: "Внутри PDF"
            disabled_if:
              field: "pdf_after_crop"
              equals: false
            default: "png_embedded"
            options:
              - value: "png_embedded"
                label: "PNG embedded"
                label_ru: "Встроенный PNG"
              - value: "jpg75_embedded"
                label: "JPG(75) embedded"
                label_ru: "Встроенный JPG 75%"
        parameters:
          fixed_args: ["trim-border"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
            "--tolerance": "tolerance"
            "--safety-margin-mm": "safety_margin_mm"
          defaults:
            input_path: "input"
            output_path: "output/trimmed"

      - id: smart_crop_white
        title: "Smart crop white"
        title_ru: "Умный кроп белого"
        description: "Trim white background to meaningful pixels."
        description_ru: "Обрезать белый фон до значимых пикселей."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: tolerance
            type: "number"
            group: "parameters"
            label: "White tolerance"
            label_ru: "Допуск белого"
            default: 10
            min: 0
            max: 255
            step: 1
          - id: safety_margin_mm
            type: "number"
            group: "parameters"
            label: "Safety margin, mm"
            label_ru: "Защитное поле, мм"
            hint: "0 mm crops exactly to the meaningful pixels. Larger values use image DPI, fallback 300 DPI."
            hint_ru: "0 мм — ровно по значимым пикселям. Больше — запас по DPI изображения, если DPI нет — 300."
            default: 0
            min: 0
            max: 50
            step: 0.1
          - id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "png"
            options: *delivery_format_options
          - *quality_field_75
          - id: pdf_after_crop
            type: "checkbox"
            group: "output"
            label: "Build PDF after crop"
            label_ru: "Собрать PDF после обрезки"
            hint: "Keeps pixels unchanged. PDF page size comes from result image DPI."
            hint_ru: "Пиксели не меняются. Размер страниц PDF берётся из DPI результата."
            default: false
          - id: pdf_embed_mode
            type: "radio"
            group: "output"
            label: "PDF content"
            label_ru: "Внутри PDF"
            disabled_if:
              field: "pdf_after_crop"
              equals: false
            default: "png_embedded"
            options:
              - value: "png_embedded"
                label: "PNG embedded"
                label_ru: "Встроенный PNG"
              - value: "jpg75_embedded"
                label: "JPG(75) embedded"
                label_ru: "Встроенный JPG 75%"
        parameters:
          fixed_args: ["smart-crop-white"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
            "--tolerance": "tolerance"
            "--safety-margin-mm": "safety_margin_mm"
          defaults:
            input_path: "input"
            output_path: "output/smart_crop_white"

      - id: split_half
        title: "Split..."
        title_ru: "Разрезать..."
        description: "Split images into strips or grid cells."
        description_ru: "Разрезать изображения на ленты или прямоугольники по сетке."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: mode
            type: "radio"
            group: "parameters"
            label: "Mode"
            label_ru: "Режим"
            default: "strips"
            options:
              - value: "strips"
                label: "Strips"
                label_ru: "Ленты"
              - value: "grid"
                label: "Grid"
                label_ru: "Сетка"
          - id: orientation
            type: "radio"
            group: "parameters"
            label: "Strip direction"
            label_ru: "Направление лент"
            default: "vertical"
            hint: "Used in Strips mode."
            hint_ru: "Используется в режиме «Ленты»."
            disabled_if:
              field: "mode"
              not_equals: "strips"
            options:
              - value: "vertical"
                label: "Vertical"
                label_ru: "Вертикальные"
              - value: "horizontal"
                label: "Horizontal"
                label_ru: "Горизонтальные"
          - id: parts
            type: "number"
            group: "parameters"
            label: "Parts"
            label_ru: "Частей"
            hint: "For strips: 2 to 10."
            hint_ru: "Для лент: от 2 до 10."
            disabled_if:
              field: "mode"
              not_equals: "strips"
            default: 2
            min: 2
            max: 10
            step: 1
          - id: rows
            type: "number"
            group: "parameters"
            label: "Rows"
            label_ru: "По вертикали"
            hint: "For grid: 2 to 10."
            hint_ru: "Для сетки: от 2 до 10."
            disabled_if:
              field: "mode"
              not_equals: "grid"
            default: 2
            min: 2
            max: 10
            step: 1
          - id: columns
            type: "number"
            group: "parameters"
            label: "Columns"
            label_ru: "По горизонтали"
            hint: "For grid: 2 to 10."
            hint_ru: "Для сетки: от 2 до 10."
            disabled_if:
              field: "mode"
              not_equals: "grid"
            default: 2
            min: 2
            max: 10
            step: 1
          - id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "png"
            options: *delivery_format_options
          - *quality_field_75
        parameters:
          fixed_args: ["split-half"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
            "--mode": "mode"
            "--orientation": "orientation"
            "--parts": "parts"
            "--rows": "rows"
            "--columns": "columns"
          defaults:
            input_path: "input"
            output_path: "output/split_png"

      - id: quick_rotate_cw
        title: "90° clockwise"
        title_ru: "90° по часовой"
        description: "Turn every picture of the Source by 90 degrees clockwise. A picture keeps its format; a JPEG is turned without loss (jpegtran) when its sides are whole numbers of its blocks, else written again at quality 95."
        description_ru: "Повернуть каждую картинку источника на 90° по часовой. Формат остаётся прежним; JPEG поворачивается без потерь (jpegtran), если его стороны кратны блокам JPEG, иначе пишется заново с качеством 95."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["rotate", "--turn", "cw90"]
          value_args: &transform_quick_io
            "--input": "input_path"
            "--output": "output_path"
          defaults:
            input_path: "input"
            output_path: "output/rotate_cw90"

      - id: quick_rotate_ccw
        title: "90° counter-clockwise"
        title_ru: "90° против"
        description: "Turn every picture of the Source by 90 degrees counter-clockwise. A picture keeps its format; a JPEG is turned without loss (jpegtran) when its sides are whole numbers of its blocks, else written again at quality 95."
        description_ru: "Повернуть каждую картинку источника на 90° против часовой. Формат остаётся прежним; JPEG поворачивается без потерь (jpegtran), если его стороны кратны блокам JPEG, иначе пишется заново с качеством 95."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["rotate", "--turn", "ccw90"]
          value_args: *transform_quick_io
          defaults:
            input_path: "input"
            output_path: "output/rotate_ccw90"

      - id: quick_rotate_180
        title: "Turn 180°"
        title_ru: "Развернуть на 180°"
        description: "Turn every picture of the Source upside down. A picture keeps its format; a JPEG is turned without loss (jpegtran) when its sides are whole numbers of its blocks, else written again at quality 95."
        description_ru: "Развернуть каждую картинку источника на 180°. Формат остаётся прежним; JPEG поворачивается без потерь (jpegtran), если его стороны кратны блокам JPEG, иначе пишется заново с качеством 95."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["rotate", "--turn", "180"]
          value_args: *transform_quick_io
          defaults:
            input_path: "input"
            output_path: "output/rotate_180"

      - id: quick_flip_h
        title: "Mirror left-right"
        title_ru: "Отразить по горизонтали"
        description: "Mirror every picture of the Source left to right. A picture keeps its format; a JPEG is turned without loss (jpegtran) when its sides are whole numbers of its blocks, else written again at quality 95."
        description_ru: "Отразить каждую картинку источника слева направо. Формат остаётся прежним; JPEG поворачивается без потерь (jpegtran), если его стороны кратны блокам JPEG, иначе пишется заново с качеством 95."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["rotate", "--turn", "flip-h"]
          value_args: *transform_quick_io
          defaults:
            input_path: "input"
            output_path: "output/flip_horizontal"

      - id: quick_flip_v
        title: "Mirror top-bottom"
        title_ru: "Отразить по вертикали"
        description: "Mirror every picture of the Source top to bottom. A picture keeps its format; a JPEG is turned without loss (jpegtran) when its sides are whole numbers of its blocks, else written again at quality 95."
        description_ru: "Отразить каждую картинку источника сверху вниз. Формат остаётся прежним; JPEG поворачивается без потерь (jpegtran), если его стороны кратны блокам JPEG, иначе пишется заново с качеством 95."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["rotate", "--turn", "flip-v"]
          value_args: *transform_quick_io
          defaults:
            input_path: "input"
            output_path: "output/flip_vertical"

      - id: rotate_angle
        title: "Turn by angle"
        title_ru: "Повернуть на угол"
        description: "Turn every picture of the Source by any angle, fractions of a degree too. The canvas grows to hold the whole picture, keeps its size, or the corners of the fill are cut away."
        description_ru: "Повернуть каждую картинку источника на любой угол, с дробями градуса. Холст растёт, чтобы вместить картинку целиком, остаётся прежним, или углы заливки обрезаются."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: angle
            type: "float"
            group: "parameters"
            label: "Angle, °"
            label_ru: "Угол, °"
            hint: "Clockwise; counter-clockwise - with a minus. Fractions: 0.5."
            hint_ru: "По часовой; против часовой - со знаком минус. Дроби: 0,5."
            required: true
            default: 1
            min: -360
            max: 360
            step: 0.1
          - id: fit
            type: "radio"
            group: "parameters"
            label: "Canvas"
            label_ru: "Холст"
            hint: "Grow: the whole picture, the corners filled. Keep: the size of the picture, its corners cut. Cut corners: the largest rectangle with no fill - for a scan that leans."
            hint_ru: "Расширить: картинка целиком, углы залиты. Оставить: размер прежний, углы картинки срезаны. Обрезать углы: самый большой прямоугольник без заливки - для скана с наклоном."
            default: "expand"
            options:
              - value: "expand"
                label: "Grow"
                label_ru: "Расширить"
              - value: "keep"
                label: "Keep the size"
                label_ru: "Оставить размер"
              - value: "inner"
                label: "Cut the corners"
                label_ru: "Обрезать углы"
          - id: fill
            type: "radio"
            group: "parameters"
            label: "Fill"
            label_ru: "Заливка"
            hint: "What fills the corners. Transparent - where the format can hold it (PNG, TIFF, WebP); a JPEG gets white."
            hint_ru: "Чем залить углы. Прозрачная - там, где формат её держит (PNG, TIFF, WebP); JPEG получит белый."
            default: "white"
            disabled_if:
              field: "fit"
              equals: "inner"
            options:
              - value: "white"
                label: "White"
                label_ru: "Белая"
                swatch: "#ffffff"
              - value: "black"
                label: "Black"
                label_ru: "Чёрная"
                swatch: "#000000"
              - value: "transparent"
                label: "Transparent"
                label_ru: "Прозрачная"
          - &transform_to_field
            id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "keep"
            options:
              - value: "keep"
                label: "As the source"
                label_ru: "Как у исходника"
              - value: "jpg"
                label: "JPG"
                label_ru: "JPG"
              - value: "png"
                label: "PNG"
                label_ru: "PNG"
              - value: "tiff"
                label: "TIFF"
                label_ru: "TIFF"
              - value: "webp"
                label: "WebP"
                label_ru: "WebP"
          - &transform_quality_field
            id: jpeg_quality
            type: "quality"
            group: "format"
            label: "Quality"
            label_ru: "Качество"
            hint: "For a JPEG and a WebP: a turned picture is written again. At 95 the difference does not show."
            hint_ru: "Для JPEG и WebP: повёрнутая картинка пишется заново. При 95 разницы на глаз нет."
            disabled_if:
              field: "to"
              not_contains_any: ["keep", "jpg", "webp"]
            default: 95
            options:
              - value: 90
                label: "90% quality"
                label_ru: "90% качества"
              - value: 95
                label: "95% quality"
                label_ru: "95% качества"
        parameters:
          fixed_args: ["rotate-angle"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--angle": "angle"
            "--fit": "fit"
            "--fill": "fill"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
          defaults:
            input_path: "input"
            output_path: "output/rotate_angle"

      - id: add_margins
        title: "Margins"
        title_ru: "Поля"
        description: "Add margins around every picture of the Source, in millimetres, in a colour. Millimetres are counted by the density the picture states; one that states none is counted at the DPI of the form."
        description_ru: "Добавить поля вокруг каждой картинки источника - в миллиметрах, заданного цвета. Миллиметры считаются по плотности, которую пишет картинка; если она ничего не пишет - по DPI формы."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: top
            type: "float"
            group: "parameters"
            label: "Top, mm"
            label_ru: "Сверху, мм"
            default: 5
            min: 0
            max: 1000
            step: 1
          - id: bottom
            type: "float"
            group: "parameters"
            label: "Bottom, mm"
            label_ru: "Снизу, мм"
            default: 5
            min: 0
            max: 1000
            step: 1
          - id: left
            type: "float"
            group: "parameters"
            label: "Left, mm"
            label_ru: "Слева, мм"
            default: 5
            min: 0
            max: 1000
            step: 1
          - id: right
            type: "float"
            group: "parameters"
            label: "Right, mm"
            label_ru: "Справа, мм"
            default: 5
            min: 0
            max: 1000
            step: 1
          - id: fill_mode
            type: "radio"
            group: "parameters"
            label: "Colour"
            label_ru: "Цвет"
            default: "white"
            options:
              - value: "white"
                label: "White"
                label_ru: "Белый"
                swatch: "#ffffff"
              - value: "black"
                label: "Black"
                label_ru: "Чёрный"
                swatch: "#000000"
              - value: "custom"
                label: "Custom"
                label_ru: "Свой"
          - id: custom_rgb
            type: "rgb_color"
            group: "parameters"
            label: "Own colour"
            label_ru: "Свой цвет"
            visible_if:
              field: "fill_mode"
              equals: "custom"
          - id: dpi
            type: "number"
            group: "parameters"
            label: "DPI where none is stated"
            label_ru: "DPI, если в картинке нет"
            hint: "Millimetres of a picture that states no density are counted at this DPI."
            hint_ru: "Миллиметры картинки без записанной плотности считаются по этому DPI."
            default: 300
            min: 50
            max: 2400
            step: 10
          - *transform_to_field
          - *transform_quality_field
        parameters:
          fixed_args: ["add-margins"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--top": "top"
            "--right": "right"
            "--bottom": "bottom"
            "--left": "left"
            "--dpi": "dpi"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
          composite_args:
            "--fill":
              field: "fill_mode"
              custom_if:
                field: "fill_mode"
                equals: "custom"
              fields: ["fill_r", "fill_g", "fill_b"]
              separator: ","
          defaults:
            input_path: "input"
            output_path: "output/margins"

  - id: size
    title: "Size"
    title_ru: "Размер"
    description: "Resize without guesswork: fit to screen targets, enforce aspect ratios, downscale, write DPI, or set a physical side in millimeters."
    description_ru: "Изменение размера без гадания: подогнать под экран, привести к пропорциям, уменьшить, записать DPI или задать физическую сторону в миллиметрах."
    fields: *module_io_fields
    children:
      - id: downscale_percent
        title: "File size"
        title_ru: "Размер файла"
        description: "Change pixel dimensions by percent - down, or up to 400 % - or fit output files to a target size."
        description_ru: "Изменить пиксельный размер по проценту - уменьшить или увеличить до 400 % - или подобрать максимальный процент под целевой размер файла."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: scale_mode
            type: "radio"
            group: "parameters"
            label: "Mode"
            label_ru: "Режим"
            hint: "Preset percent, custom percent, or automatic fit to target megabytes."
            hint_ru: "Фиксированный процент, свой процент или автоматический подбор под целевой размер в мегабайтах."
            default: "percent-50"
            choice_style: "segmented"
            span: "full"
            options:
              - value: "percent-25"
                label: "25%"
                label_ru: "25%"
              - value: "percent-50"
                label: "50%"
                label_ru: "50%"
              - value: "custom"
                label: "Custom %"
                label_ru: "Свой %"
              - value: "target-mb"
                label: "Fit"
                label_ru: "Подогнать"
          - id: custom_percent
            type: "number"
            group: "parameters"
            label: "Custom percent"
            label_ru: "Свой процент"
            hint: "Manual scale percent from 0.1 to 400: over 100 makes the picture larger. Active only in Custom % mode."
            hint_ru: "Ручной процент масштаба от 0,1 до 400: больше 100 - увеличение. Работает только в режиме «Свой %»."
            default: 75
            min: 0.1
            max: 400
            step: 1
            visible_if:
              field: "scale_mode"
              equals: "custom"
          - id: target_mb
            type: "float"
            group: "parameters"
            label: "Target MB"
            label_ru: "Цель, MB"
            hint: "Target output size per file. The engine searches the largest percent that fits the limit; 0.8-1.0 of the target is considered a good hit."
            hint_ru: "Целевой размер каждого файла. Движок ищет максимальный процент, который влезает в лимит; попадание 0,8-1,0 от цели считается нормальным."
            default: 1
            min: 0.1
            max: 999
            step: 0.1
            visible_if:
              field: "scale_mode"
              equals: "target-mb"
          - id: algorithm
            type: "radio"
            group: "parameters"
            label: "Algorithm"
            label_ru: "Алгоритм"
            hint: "Lanczos: best visual quality for photos and soft images, but can create halos and inflate PNG maps. Bicubic: good photo/JPG compromise; smoother and smarter than simple averaging, but may add intermediate colors around sharp map lines. Box: dry averaging filter for maps, plans, screenshots and flat graphics; fewer halos and usually smaller PNG than Lanczos/Bicubic. Nearest: no new colors, often smallest PNG, but diagonals and text can become jagged."
            hint_ru: "Lanczos: лучшее визуальное качество для фото и мягких изображений, но может давать ореолы и раздувать PNG-карты. Bicubic: хороший компромисс для фото/JPG; умнее простого усреднения, но может добавлять промежуточные цвета вокруг резких линий карты. Box: сухое усреднение для карт, планов, скриншотов и плоской графики; меньше ореолов и обычно легче PNG, чем Lanczos/Bicubic. Nearest: не создаёт новых цветов, часто даёт самый маленький PNG, но диагонали и текст могут стать ступенчатыми."
            default: "lanczos"
            choice_style: "segmented"
            span: "full"
            options:
              - value: "lanczos"
                label: "Lanczos"
                label_ru: "Lanczos"
              - value: "bicubic"
                label: "Bicubic"
                label_ru: "Bicubic"
              - value: "box"
                label: "Box"
                label_ru: "Box"
              - value: "nearest"
                label: "Nearest"
                label_ru: "Nearest"
          - id: unsharp
            type: "radio"
            group: "parameters"
            label: "Unsharp Mask"
            label_ru: "Unsharp Mask"
            hint: "Mild sharpening after Lanczos downscale."
            hint_ru: "Мягкая резкость после уменьшения Lanczos."
            disabled_if:
              field: "algorithm"
              not_equals: "lanczos"
            default: true
            options:
              - value: true
                label: "On"
                label_ru: "Вкл"
              - value: false
                label: "Off"
                label_ru: "Выкл"
          - id: print_size_mode
            type: "radio"
            group: "parameters"
            label: "Print size"
            label_ru: "Печать"
            hint: "Scale changes pixel dimensions and keeps DPI metadata, so printed centimeters change. DPI changes pixel dimensions and writes proportional DPI, so printed centimeters stay the same."
            hint_ru: "«Изменить масштаб» меняет пиксели и сохраняет DPI, поэтому сантиметры при печати меняются. «Изменить DPI» меняет пиксели и записывает пропорциональный DPI, поэтому сантиметры при печати остаются прежними."
            default: "scale"
            choice_style: "segmented"
            span: "full"
            options:
              - value: "dpi"
                label: "Change DPI"
                label_ru: "Изменить DPI"
              - value: "scale"
                label: "Change scale"
                label_ru: "Изменить масштаб"
          - id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "png"
            options: *delivery_format_options
          - *quality_field_75
        parameters:
          fixed_args: ["downscale-percent"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
            "--scale-mode": "scale_mode"
            "--custom-percent": "custom_percent"
            "--target-mb": "target_mb"
            "--algorithm": "algorithm"
            "--unsharp": "unsharp"
            "--print-size-mode": "print_size_mode"
          defaults:
            input_path: "input"
            output_path: "output/downscale_percent"

      - id: plotter_size
        title: "Fit to roll"
        title_ru: "Под рулон"
        description: "Keep pixels and write DPI so the selected side matches millimeters."
        description_ru: "Оставить пиксели и записать DPI так, чтобы выбранная сторона совпала с мм."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: side
            type: "radio"
            group: "parameters"
            label: "Side"
            label_ru: "Сторона"
            default: "short"
            options:
              - value: "short"
                label: "Short"
                label_ru: "Короткая"
              - value: "long"
                label: "Long"
                label_ru: "Длинная"
          - id: target_mm
            type: "number"
            group: "parameters"
            label: "Target mm"
            label_ru: "Цель, мм"
            hint: "Final physical size of the selected side."
            hint_ru: "Итоговый физический размер выбранной стороны."
            default: 900
            min: 1
            max: 5000
            step: 1
          - id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "png"
            options: *pixel_dpi_format_options
        parameters:
          fixed_args: ["plotter-size"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--side": "side"
            "--target-mm": "target_mm"
          defaults:
            input_path: "input"
            output_path: "output/plotter_roll_fit"

      - id: plotter_dpi_only
        title: "DPI only for roll"
        title_ru: "DPI"
        description: "Keep pixels and write DPI metadata only."
        description_ru: "Оставить пиксели и только записать DPI."
        service: "system_core.services.image_tools_gui:run_plotter_dpi_only"
        kind: "safe"
        fields:
          - id: dpi_preset
            type: "radio"
            group: "parameters"
            label: "DPI"
            label_ru: "DPI"
            default: "300"
            options:
              - value: "150"
                label: "150"
                label_ru: "150"
              - value: "300"
                label: "300"
                label_ru: "300"
              - value: "custom"
                label: "Custom"
                label_ru: "Ввести"
          - id: dpi_custom
            type: "number"
            group: "parameters"
            label: "Custom DPI"
            label_ru: "Свой DPI"
            hint: "Used only when DPI is set to Custom."
            hint_ru: "Используется только если выбран пункт «Ввести»."
            disabled_if:
              field: "dpi_preset"
              not_equals: "custom"
            # Asked for while "Custom" is chosen: an empty one used to become 300 without a word.
            required: true
            default: ""
            min: 1
            max: 2400
            step: 1
          - id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "png"
            options: *pixel_dpi_format_options
        parameters:
          defaults:
            input_path: "input"
            output_path: "output/plotter_dpi_only"
      - id: resize_screen
        title: "Fit to screen"
        title_ru: "Под экран"
        description: "Resize to 1080p, 1440p or 2160p/UHD with Lanczos. Actual upscale to UHD applies a mild Unsharp Mask."
        description_ru: "Подогнать под 1080p, 1440p или 2160p/UHD через Lanczos. При реальном апскейле до UHD применяется мягкая Unsharp Mask."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: target
            type: "radio"
            group: "parameters"
            label: "Screen target"
            label_ru: "Размер экрана"
            hint: "1080p = 1920x1080, 1440p = 2560x1440, 2160p/UHD = 3840x2160. Actual UHD upscale adds a mild Unsharp Mask after Lanczos."
            hint_ru: "1080p = 1920x1080, 1440p = 2560x1440, 2160p/UHD = 3840x2160. Если 2160p реально увеличивает изображение, после Lanczos добавляется мягкая Unsharp Mask."
            default: "2160p"
            options:
              - value: "1080p"
                label: "1080p"
                label_ru: "1080p"
              - value: "1440p"
                label: "1440p"
                label_ru: "1440p"
              - value: "2160p"
                label: "2160p"
                label_ru: "2160p"
          - id: mode
            type: "radio"
            group: "parameters"
            label: "Fit mode"
            label_ru: "Режим подгонки"
            hint: "Crop fills the target and cuts edges; Contain preserves all pixels; Pad preserves all pixels and adds background."
            hint_ru: "Обрезка заполняет целевой кадр и режет края; Вписать сохраняет всё изображение; Поля сохраняют всё изображение и добавляют фон."
            default: "crop"
            options:
              - value: "crop"
                label: "Crop"
                label_ru: "Обрезка"
              - value: "contain"
                label: "Contain"
                label_ru: "Вписать"
              - value: "pad"
                label: "Pad"
