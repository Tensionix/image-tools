              equals: true
            default: ""
            min: 1
            max: 1200
            step: 1
        parameters:
          fixed_args: ["images-to-pdf"]
          value_args:
            "--input": "input_path"
            "--output": "output_file"
            "--mode": "mode"
            "--bundle": "bundle"
            "--dpi": "dpi"
          defaults:
            input_path: "input"
            output_file: "output/images.pdf"
          ui_only_fields: ["preserve_dpi"]

  - id: sheets_and_marks
    title: "Sheets and marks"
    title_ru: "Листы и метки"
    description: "Production sheet helpers: tile labels, make overview/contact layouts, add text watermarks, and split multipage TIFF files."
    description_ru: "Помощники для производственных листов: разложить наклейки, собрать обзорные/контактные раскладки, добавить водяной знак и разделить многостраничный TIFF."
    fields: *module_io_fields
    children:
      - id: tile_sheet
        title: "Tile sheet"
        title_ru: "Замостить лист"
        description: "Repeat one image across A5/A4/A3 or a custom-width roll."
        description_ru: "Размножить одно изображение на A5/A4/A3 или рулон заданной ширины."
        service: "system_core.services.image_tools_gui:run_tile_sheet"
        kind: "safe"
        fields:
          - id: paper
            type: "radio"
            group: "format"
            label: "Paper"
            label_ru: "Бумага"
            default: "a4"
            options:
              - value: "a5"
                label: "A5"
                label_ru: "A5"
              - value: "a4"
                label: "A4"
                label_ru: "A4"
              - value: "a3"
                label: "A3"
                label_ru: "A3"
              - value: "roll"
                label: "Roll"
                label_ru: "Рулон"
          - id: orientation
            type: "radio"
            group: "format"
            label: "Orientation"
            label_ru: "Ориентация"
            default: "portrait"
            visible_if:
              field: "paper"
              not_equals: "roll"
              default: "a4"
            options:
              - value: "portrait"
                label: "Portrait"
                label_ru: "Портрет"
              - value: "landscape"
                label: "Landscape"
                label_ru: "Альбом"
          - id: margin_mm
            type: "float"
            group: "parameters"
            label: "Margin, mm"
            label_ru: "Поля, мм"
            default: 7
            min: 0
            max: 100
            step: 0.5
          - id: gap_mm
            type: "float"
            group: "parameters"
            label: "Gap, mm"
            label_ru: "Зазор, мм"
            default: 0
            min: 0
            max: 50
            step: 0.5
          - id: dpi
            type: "number"
            group: "format"
            label: "DPI"
            label_ru: "DPI"
            default: 300
            min: 72
            max: 1200
            step: 1
          - id: to
            type: "radio"
            group: "format"
            label: "Output"
            label_ru: "Вывод"
            default: "tiff"
            options:
              - value: "tiff"
                label: "TIFF"
                label_ru: "TIFF"
              - value: "png"
                label: "PNG"
                label_ru: "PNG"
          - id: size_mode
            type: "radio"
            group: "parameters"
            label: "Sticker size"
            label_ru: "Размер наклейки"
            default: "source"
            options:
              - value: "source"
                label: "As is"
                label_ru: "Как есть"
              - value: "width"
                label: "By width"
                label_ru: "По ширине"
              - value: "height"
                label: "By height"
                label_ru: "По высоте"
              - value: "doc-40x30"
                label: "Document 40x30"
                label_ru: "Документ 40x30"
              - value: "doc-60x40"
                label: "Document 60x40"
                label_ru: "Документ 60x40"
          - id: item_width_mm
            type: "float"
            group: "parameters"
            label: "Width, mm"
            label_ru: "Ширина, мм"
            default: 40
            min: 1
            max: 1000
            step: 0.5
          - id: item_height_mm
            type: "float"
            group: "parameters"
            label: "Height, mm"
            label_ru: "Высота, мм"
            default: 30
            min: 1
            max: 1000
            step: 0.5
          - id: box_fit
            type: "radio"
            group: "parameters"
            label: "Preset fit"
            label_ru: "Вписывание пресета"
            default: "contain"
            options:
              - value: "contain"
                label: "No crop"
                label_ru: "Без обрезки"
              - value: "crop"
                label: "Crop to box"
                label_ru: "Обрезать в рамку"
          - id: count_mode
            type: "radio"
            group: "options"
            label: "Count"
            label_ru: "Количество"
            default: "fill"
            visible_if:
              field: "paper"
              not_equals: "roll"
              default: "a4"
            options:
              - value: "fill"
                label: "Fill sheet"
                label_ru: "Заполнить лист"
              - value: "copies"
                label: "Exact copies"
                label_ru: "Точно копий"
              - value: "rows"
                label: "Exact rows"
                label_ru: "Точно рядов"
          - id: roll_count_mode
            type: "radio"
            group: "options"
            label: "Roll count"
            label_ru: "Количество на рулоне"
            default: "rows"
            visible_if:
              field: "paper"
              equals: "roll"
              default: "a4"
            options:
              - value: "copies"
                label: "Exact copies"
                label_ru: "Точно копий"
              - value: "rows"
                label: "Exact rows"
                label_ru: "Точно рядов"
          - id: copies
            type: "number"
            group: "options"
            label: "Copies"
            label_ru: "Копий"
            default: 24
            min: 0
            max: 10000
            step: 1
            visible_if_any:
              - all:
                  - field: "paper"
                    not_equals: "roll"
                    default: "a4"
                  - field: "count_mode"
                    equals: "copies"
                    default: "fill"
              - all:
                  - field: "paper"
                    equals: "roll"
                    default: "a4"
                  - field: "roll_count_mode"
                    equals: "copies"
                    default: "rows"
          - id: rows
            type: "number"
            group: "options"
            label: "Rows"
            label_ru: "Рядов"
            default: 1
            min: 0
            max: 1000
            step: 1
            visible_if_any:
              - all:
                  - field: "paper"
                    not_equals: "roll"
                    default: "a4"
                  - field: "count_mode"
                    equals: "rows"
                    default: "fill"
              - all:
                  - field: "paper"
                    equals: "roll"
                    default: "a4"
                  - field: "roll_count_mode"
                    equals: "rows"
                    default: "rows"
          - id: roll_width_mm
            type: "float"
            group: "options"
            label: "Roll width, mm"
            label_ru: "Ширина рулона, мм"
            default: 600
            min: 1
            max: 5000
            step: 1
            visible_if:
              field: "paper"
              equals: "roll"
              default: "a4"
          - id: frame_mm
            type: "float"
            group: "options"
            label: "Frame, mm"
            label_ru: "Рамка, мм"
            default: 0.2
            min: 0
            max: 10
            step: 0.1
          - id: frame_color
            type: "text"
            group: "options"
            label: "Frame color"
            label_ru: "Цвет рамки"
            default: "#999999"
          - id: background
            type: "text"
            group: "options"
            label: "Background"
            label_ru: "Фон"
            default: "white"
        parameters:
          defaults:
            input_path: "input"
            output_path: "output/tile_sheet"

      - id: split_tiff
        title: "Split TIFF"
        title_ru: "Разделить TIFF"
        description: "Split multi-page TIFF to PNG frames."
        description_ru: "Разделить многостраничный TIFF на PNG-кадры."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["split-tiff"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
          defaults:
            input_path: "input"
            output_path: "output/tiff_frames"

      - id: watermark
        title: "Watermark"
        title_ru: "Водяной знак"
        description: "Add a corner text watermark or a diagonal protective watermark."
        description_ru: "Добавить текстовый водяной знак в углу или диагональную защитную надпись."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: text
            type: "text"
            group: "parameters"
            label: "Watermark text"
            label_ru: "Текст водяного знака"
            default: ""
            required: true
          - id: watermark_mode
            type: "radio"
            group: "parameters"
            label: "Mode"
            label_ru: "Режим"
            hint: "Corner mode adds a normal horizontal label in the selected corner. Diagonal protective mode centers the text across the image diagonal and scales it to the selected diagonal coverage."
            hint_ru: "Режим в углу добавляет обычную горизонтальную подпись в выбранном углу. Диагональный защитный режим ставит текст по центру диагонали и масштабирует его по выбранному покрытию диагонали."
            default: "corner"
            choice_style: "segmented"
            span: "full"
            options:
              - value: "corner"
                label: "Corner"
                label_ru: "В углу"
              - value: "diagonal"
                label: "Diagonal protective"
                label_ru: "Диагональный защитный"
          - id: position
            type: "radio"
            group: "parameters"
            label: "Position"
            label_ru: "Позиция"
            hint: "Used only in Corner mode."
            hint_ru: "Используется только в режиме «В углу»."
            default: "bottom-right"
            visible_if:
              field: "watermark_mode"
              equals: "corner"
            options:
              - value: "bottom-right"
                label: "Bottom right"
                label_ru: "Снизу справа"
              - value: "bottom-left"
                label: "Bottom left"
                label_ru: "Снизу слева"
              - value: "top-right"
                label: "Top right"
                label_ru: "Сверху справа"
              - value: "top-left"
                label: "Top left"
                label_ru: "Сверху слева"
          - id: diagonal_coverage
            type: "float"
            group: "parameters"
            label: "Diagonal coverage, %"
            label_ru: "Длина по диагонали, %"
            hint: "Used only in Diagonal protective mode. 60 means the watermark text is fitted to about 60% of the full image diagonal, leaving room for short large words such as COPY."
            hint_ru: "Используется только в диагональном защитном режиме. Значение 60 означает, что текст подгоняется примерно под 60% полной диагонали изображения и оставляет воздух для коротких крупных слов вроде «КОПИЯ»."
            default: 60
            min: 5
            max: 150
            step: 5
            visible_if:
              field: "watermark_mode"
              equals: "diagonal"
          - id: margin
            type: "number"
            group: "parameters"
            label: "Corner margin, px"
            label_ru: "Отступ от угла, px"
            hint: "Used only in Corner mode."
            hint_ru: "Используется только в режиме «В углу»."
            default: 32
            min: 0
            max: 5000
            step: 1
            visible_if:
              field: "watermark_mode"
              equals: "corner"
          - id: font_size
            type: "number"
            group: "parameters"
            label: "Corner font size"
            label_ru: "Кегль в углу"
            hint: "Used only in Corner mode. Watermarks use Arial Bold when available. Diagonal protective mode chooses the font size automatically from the diagonal coverage."
            hint_ru: "Используется только в режиме «В углу». Водяной знак использует Arial Bold, если шрифт доступен. Диагональный защитный режим подбирает размер шрифта автоматически по длине диагонали."
            default: 36
            min: 1
            max: 1000
            step: 1
            visible_if:
              field: "watermark_mode"
              equals: "corner"
          - id: opacity
            type: "number"
            group: "parameters"
            label: "Opacity"
            label_ru: "Прозрачность"
            hint: "Alpha channel for the watermark: 0 is invisible, 255 is fully opaque. Default 64 is about 25% opacity and is chosen for print, where marks usually look darker than on screen."
            hint_ru: "Альфа-канал водяного знака: 0 — невидимый, 255 — полностью непрозрачный. Дефолт 64 — около 25% непрозрачности; он выбран под печать, где знаки обычно выглядят темнее, чем на экране."
            default: 64
            min: 0
            max: 255
            step: 5
          - id: color_mode
            type: "radio"
            group: "parameters"
            label: "Color"
            label_ru: "Цвет"
            hint: "Color presets with visible swatches. Choose Custom RGB to enter exact Red, Green, and Blue values."
            hint_ru: "Цветовые пресеты с видимыми плашками. Выберите «Свой RGB», чтобы вручную задать красный, зелёный и синий каналы."
            default: "#cc0000"
            choice_style: "chips"
            span: "full"
            options:
              - value: "#cc0000"
                label: "Red"
                label_ru: "Красный"
                swatch: "#cc0000"
              - value: "#000000"
                label: "Black"
                label_ru: "Чёрный"
                swatch: "#000000"
              - value: "#ffffff"
                label: "White"
                label_ru: "Белый"
                swatch: "#ffffff"
              - value: "#ffcc00"
                label: "Yellow"
                label_ru: "Жёлтый"
                swatch: "#ffcc00"
              - value: "#666666"
                label: "Gray"
                label_ru: "Серый"
                swatch: "#666666"
              - value: "#0066cc"
                label: "Blue"
                label_ru: "Синий"
                swatch: "#0066cc"
              - value: "custom"
                label: "Custom RGB"
                label_ru: "Свой RGB"
                swatch: "linear-gradient(90deg, #cc0000, #00aa44, #0066cc)"
          - id: custom_rgb
            type: "rgb_color"
            group: "parameters"
            label: "Custom RGB"
            label_ru: "Свой RGB"
            hint: "Live color patch and exact Red, Green, Blue channels, 0..255. The value is passed to the engine as R,G,B."
            hint_ru: "Живой цветовой патч и точные каналы Red, Green, Blue, 0..255. В движок значение передаётся как R,G,B."
            span: "full"
            visible_if:
              field: "color_mode"
              equals: "custom"
          - id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "png"
            options: *delivery_format_options
          - *quality_field_75
        parameters:
          fixed_args: ["watermark"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
            "--text": "text"
            "--watermark-mode": "watermark_mode"
            "--position": "position"
            "--diagonal-coverage": "diagonal_coverage"
            "--margin": "margin"
            "--opacity": "opacity"
            "--font-size": "font_size"
          composite_args:
            "--color":
              field: "color_mode"
              custom_if:
                field: "color_mode"
                equals: "custom"
              fields: ["color_r", "color_g", "color_b"]
              separator: ","
          defaults:
            input_path: "input"
            output_path: "output/watermark"
            color_r: 204
            color_g: 0
            color_b: 0
          ui_only_fields: ["custom_rgb"]


  - id: contact_sheet
    title: "Contact sheet"
    title_ru: "Контактный лист"
    description: "Build visual proof sheets for checking a folder at a glance: thumbnails with KB, pixels, centimeters, DPI, output format and quality."
    description_ru: "Собрать контрольный лист для быстрой проверки папки: превью с KB, пикселями, сантиметрами, DPI, форматом вывода и качеством."
    service: "system_core.services.image_tools_gui:run_manifest_cli"
    kind: "safe"
    fields:
      - id: input_path
        type: "folder"
        group: "source"
        label: "SOURCE"
        label_ru: "ИСТОЧНИК"
        hint: "Optional. Leave empty to use the command default input folder."
        hint_ru: "Необязательно. Оставь пустым, чтобы использовать стандартную папку input для команды."
        placeholder: "input"
        default: ""
        omit_if_empty: true
      - id: output_path
        type: "folder"
        group: "output"
        label: "DESTINATION"
        label_ru: "ПРИЁМНИК"
        hint: "Optional. Leave empty to use the command default output folder."
        hint_ru: "Необязательно. Оставь пустым, чтобы использовать стандартную папку output для команды."
        placeholder: "output"
        default: ""
        omit_if_empty: true
        show_new_folder_button: true
      - id: columns
        type: "number"
        group: "parameters"
        label: "Columns"
        label_ru: "Колонки"
        default: 4
        min: 1
        max: 20
        step: 1
      - id: thumb_size_mode
        type: "radio"
        group: "thumbnail"
        label: "Size mode"
        label_ru: "Режим размера"
        default: "preset"
        options:
          - value: "preset"
            label: "List"
            label_ru: "Из списка"
          - value: "custom"
            label: "Custom"
            label_ru: "Свой размер"
      - id: thumb_preset
        type: "select"
        group: "thumbnail"
        label: "Thumb size"
        label_ru: "Размер миниатюры"
        visible_if:
          field: "thumb_size_mode"
          equals: "preset"
        default: "640x480"
        options:
          - value: "320x240"
            label: "320x240"
            label_ru: "320x240"
          - value: "480x360"
            label: "480x360"
            label_ru: "480x360"
          - value: "640x480"
            label: "640x480"
            label_ru: "640x480"
          - value: "800x600"
            label: "800x600"
            label_ru: "800x600"
          - value: "1024x768"
            label: "1024x768"
            label_ru: "1024x768"
          - value: "1280x720"
            label: "1280x720"
            label_ru: "1280x720"
          - value: "1280x960"
            label: "1280x960"
            label_ru: "1280x960"
          - value: "1600x900"
            label: "1600x900"
            label_ru: "1600x900"
          - value: "1920x1080"
            label: "1920x1080"
            label_ru: "1920x1080"
      - id: thumb_width
        type: "number"
        group: "thumbnail"
        label: "Thumb width"
        label_ru: "Ширина миниатюры"
        visible_if:
          field: "thumb_size_mode"
          equals: "custom"
        default: 640
        min: 1
        max: 10000
        step: 1
      - id: thumb_height
        type: "number"
        group: "thumbnail"
        label: "Thumb height"
        label_ru: "Высота миниатюры"
        visible_if:
          field: "thumb_size_mode"
          equals: "custom"
        default: 480
        min: 1
        max: 10000
        step: 1
      - id: to
        type: "radio"
        group: "format"
        label: "Output format"
        label_ru: "Формат вывода"
        default: "png"
        options: *delivery_format_options
      - *quality_field_92
    parameters:
      fixed_args: ["contact-sheet"]
      value_args:
        "--input": "input_path"
        "--output": "output_file"
        "--to": "to"
        "--jpeg-quality": "jpeg_quality"
        "--columns": "columns"
      composite_args:
        "--thumb-size":
          field: "thumb_preset"
          manual_if:
            field: "thumb_size_mode"
            equals: "custom"
          fields: ["thumb_width", "thumb_height"]
          separator: "x"
      defaults:
        input_path: "input"
        output_file: "output/contact_sheet.png"

  - id: diagnostics
    title: "Diagnostics"
    title_ru: "Диагностика"
    description: "Safe diagnostics: list supported formats, show project paths and runtime information, and verify the portable environment."
    description_ru: "Безопасная диагностика: показать поддерживаемые форматы, пути проекта, сведения о runtime и проверить портативное окружение."
    children:
      - id: formats
        title: "Formats"
        title_ru: "Форматы"
        description: "Show supported formats and adapters."
        description_ru: "Показать поддерживаемые форматы и адаптеры."
        service: "system_core.services.image_tools_gui:run_cli_command"
        kind: "safe"
        parameters:
          args: ["formats"]

