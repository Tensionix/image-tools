        description_ru: "Запустить проверку окружения проекта."
        service: "system_core.services.image_tools_gui:run_doctor"
        kind: "safe"

maintenance_operations:
  - id: cleanup_input_output
    title: "Clear I/O"
    title_ru: "Очистить I/O"
    description: "Delete contents of managed input and output folders."
    description_ru: "Удалить содержимое управляемых папок input и output."
    service: "system_core.services.image_tools_gui:cleanup_input_output"
    kind: "dangerous"
