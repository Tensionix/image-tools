            input_path: "input"
            output_path: "output/scale_x2"

      - id: quick_scale_x3
        title: "×3"
        title_ru: "×3"
        description: "Make every picture of the Source three times as large on each side. A picture keeps its format and the density it states, so it prints larger by as much; a JPEG is written again at quality 92."
        description_ru: "Увеличить каждую картинку источника втрое по каждой стороне. Картинка сохраняет формат и записанную плотность, поэтому и печатается во столько же раз крупнее; JPEG пишется заново с качеством 92."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["scale", "--percent", "300"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
          defaults:
