            output_path: "output/scale_x3"


  - id: documents
    title: "Documents"
    title_ru: "Документы"
    description: "The pictures inside DOCX, PPTX and PDF: their resolution checked, and raised in a copy."
    description_ru: "Картинки внутри DOCX, PPTX и PDF: проверить их разрешение и довести его в копии документа."
    fields: *module_io_fields
    children:
      - id: docs_dpi_check
        title: "Check DPI"
        title_ru: "Проверить DPI"
        description: "Read every document of the Source and write nothing into it: a line for every placed picture - its pixels, the size it is placed at, the resolution that comes of it, the density it states - and the total of those below the threshold. The table goes to the journal and into the report folder as CSV and Markdown."
        description_ru: "Прочитать каждый документ источника, ничего в него не записывая: строка на каждую вставленную картинку - пиксели, размер вставки, разрешение, которое из этого выходит, и число, которое картинка пишет о себе, - и итог: сколько ниже порога. Таблица - в журнал и в папку отчёта, CSV и Markdown."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - &documents_kinds_field
            id: kinds
            type: "checkboxes"
            group: "source"
            label: "Documents"
            label_ru: "Документы"
            hint: "Which documents of the Source to read."
            hint_ru: "Какие документы источника читать."
            min_selected: 1
            default: ["docx", "pptx", "pdf"]
            options:
              - value: "docx"
                label: "DOCX"
                label_ru: "DOCX"
                tone: "docx"
              - value: "pptx"
                label: "PPTX"
                label_ru: "PPTX"
                tone: "pptx"
              - value: "pdf"
                label: "PDF"
                label_ru: "PDF"
                tone: "pdf"
          - &documents_threshold_field
            id: threshold_preset
            type: "radio"
            group: "parameters"
            label: "Threshold, ppi"
            label_ru: "Порог, ppi"
            hint: "The resolution a picture has to reach: its pixels against the size it is placed at."
            hint_ru: "Разрешение, до которого картинка должна дотянуть: её пиксели против размера вставки."
            default: "300"
            options:
              - value: "150"
                label: "150"
                label_ru: "150"
              - value: "200"
                label: "200"
                label_ru: "200"
              - value: "300"
                label: "300"
                label_ru: "300"
              - value: "600"
                label: "600"
                label_ru: "600"
              - value: "custom"
                label: "Custom"
                label_ru: "Свой"
          - &documents_threshold_custom_field
            id: threshold_custom
            type: "number"
            group: "parameters"
            label: "Own threshold"
            label_ru: "Свой порог"
            hint: "Used when the threshold is set to Custom."
            hint_ru: "Действует, когда выбран свой порог."
            required: true
            default: 400
            min: 50
            max: 2400
            step: 10
            visible_if:
              field: "threshold_preset"
              equals: "custom"
        parameters:
          fixed_args: ["docs-dpi-check"]
          value_args:
            "--input": "input_path"
            "--kinds": "kinds"
          composite_args:
            "--threshold":
              field: "threshold_preset"
              custom_if:
                field: "threshold_preset"
                equals: "custom"
              fields: ["threshold_custom"]
          defaults:
            input_path: "input"
            output_path: "output/docs_dpi_check"

      - id: docs_dpi_raise
        title: "Raise to DPI"
        title_ru: "Довести до DPI"
        description: "Write a copy of every document of the Source into the Target, its pictures at the threshold. Only the pictures change: the text, the pages, the place and the size of every picture stay. A picture below the threshold gets pixels; one at it keeps its pixels and states the threshold of itself. Word and PowerPoint are told not to compress the pictures back. Every copy is checked before it is called done; a signed or encrypted document is refused."
        description_ru: "Записать в назначение копию каждого документа источника, картинки в ней - не ниже порога. Меняются только картинки: текст, страницы, место и размер каждой вставки остаются. Картинке ниже порога добавляются пиксели; картинка на пороге и выше сохраняет пиксели и только пишет о себе порог. Word и PowerPoint получают запрет сжимать картинки обратно. Каждая копия проверяется, прежде чем названа готовой; документ с подписью или шифром - отказ."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - *documents_kinds_field
          - *documents_threshold_field
          - *documents_threshold_custom_field
          - &documents_what_field
            id: what
            type: "radio"
            group: "parameters"
            label: "What to raise"
            label_ru: "Что приводить"
            hint: "Pixels and label: the picture gets the pixels it lacks and states the threshold of itself. Label only: no pixel is added, the picture only states the threshold - its real resolution stays what it was."
            hint_ru: "Пиксели и метку: картинка получает недостающие пиксели и пишет о себе порог. Только метку: пиксели не добавляются, картинка лишь пишет о себе порог - настоящее разрешение остаётся прежним."
            default: "actual"
            options:
              - value: "actual"
                label: "Pixels and label"
                label_ru: "Пиксели и метку"
              - value: "label"
                label: "Label only"
                label_ru: "Только метку"
          - &documents_method_field
            id: method
            type: "radio"
            group: "parameters"
            label: "Adding pixels"
            label_ru: "Как добавлять пиксели"
            hint: "Repeat: every pixel becomes a square of 2 x 2 (3 x 3 when two are not enough) - the picture looks exactly as before, the file grows. Smooth: Lanczos to the threshold - a smaller file, fine detail softens."
            hint_ru: "Повтор: каждый пиксель становится квадратом 2 × 2 (3 × 3, если двух мало) - картинка выглядит точно как раньше, файл растёт. Плавный: пересчёт Lanczos до порога - файл меньше, мелкое размывается."
            default: "repeat"
            disabled_if:
              field: "what"
              equals: "label"
            options:
              - value: "repeat"
                label: "Repeat pixels"
                label_ru: "Повтор пикселей"
              - value: "smooth"
                label: "Smooth"
                label_ru: "Плавный пересчёт"
          - &documents_raise_quality_field
            id: jpeg_quality
            type: "quality"
            group: "format"
            label: "JPEG quality"
            label_ru: "Качество JPEG"
            disabled_if:
              field: "what"
              equals: "label"
            default: 95
            options:
              - value: 90
                label: "90% quality"
                label_ru: "90% качества"
              - value: 95
                label: "95% quality"
                label_ru: "95% качества"
          - &documents_keep_lossless_field
            id: keep_lossless
            type: "checkbox"
            group: "format"
            label: "Keep lossless pictures lossless"
            label_ru: "Без потерь оставлять без потерь"
            hint: "A PNG or a Flate picture stays without loss. Off - it becomes a JPEG, unless it has a mask, a palette or one bit to a pixel."
            hint_ru: "PNG и картинка Flate остаются без потерь. Выключено - становятся JPEG, если у них нет маски, палитры или одного бита на пиксель."
            default: false
          - id: office_may_compress
            type: "checkbox"
            group: "output"
            label: "Let Word and PowerPoint compress the pictures"
            label_ru: "Разрешить Word и PowerPoint сжимать картинки"
            hint: "Off - the copy carries the flag that keeps Word and PowerPoint from compressing its pictures when it is saved: without it Word takes them back to 220 ppi at the first save (measured)."
            hint_ru: "Выключено - копия несёт флажок, который не даёт Word и PowerPoint сжимать её картинки при сохранении: без него Word при первом сохранении возвращает их к 220 ppi (замер)."
            default: false
        parameters:
          fixed_args: ["docs-dpi-raise"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--kinds": "kinds"
            "--what": "what"
            "--method": "method"
            "--jpeg-quality": "jpeg_quality"
          flag_args:
            "--keep-lossless": "keep_lossless"
            "--office-may-compress": "office_may_compress"
          composite_args:
            "--threshold":
              field: "threshold_preset"
              custom_if:
                field: "threshold_preset"
                equals: "custom"
              fields: ["threshold_custom"]
          defaults:
            input_path: "input"
            output_path: "output/docs_dpi_raise"

      - id: docs_shrink
        title: "Shrink in documents"
        title_ru: "Уменьшить в документе"
        description: "Shrink the pictures of every DOCX and PPTX of the Source to a limit and recompress them; the copies go into the Target. HARD: a PNG becomes a JPEG - unless it is lighter than the barrier in KB, would come out heavier as a JPEG, or is transparent: a transparent PNG stays a PNG, made smaller when over the limit. With an own limit a PNG small in pixels may stay as it is, and SAFE touches only JPEGs."
        description_ru: "Уменьшить картинки каждого DOCX и PPTX источника до предела и пережать их; копии - в назначение. HARD: PNG становится JPEG - если он не легче барьера в КБ, не вышел бы в JPEG тяжелее и не прозрачный: прозрачный PNG остаётся PNG и уменьшается, если больше предела. Со своим пределом мелкие в пикселях PNG можно оставить как есть, а SAFE трогает только JPEG."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - &office_kinds_field
            id: kinds
            type: "checkboxes"
            group: "source"
            label: "Documents"
            label_ru: "Документы"
            hint: "Which documents of the Source to take. A PDF is not the business of these operations."
            hint_ru: "Какие документы источника брать. PDF этим операциям не по делу."
            min_selected: 1
            default: ["docx", "pptx"]
            options:
              - value: "docx"
                label: "DOCX"
                label_ru: "DOCX"
                tone: "docx"
              - value: "pptx"
                label: "PPTX"
                label_ru: "PPTX"
                tone: "pptx"
          - id: limit
            type: "radio"
            group: "parameters"
            label: "Limit"
            label_ru: "Предел"
            hint: "The largest picture a document keeps. 1920 x 1080 - an ordinary document; 2560 x 1440 - a presentation; 3840 x 2160 - print or archive."
            hint_ru: "Самая большая картинка, которую оставляет документ. 1920 × 1080 - обычный документ; 2560 × 1440 - презентация; 3840 × 2160 - печать или архив."
            default: "1920x1080"
            options:
              - value: "1920x1080"
                label: "1920 × 1080"
                label_ru: "1920 × 1080"
              - value: "2560x1440"
                label: "2560 × 1440"
                label_ru: "2560 × 1440"
              - value: "3840x2160"
                label: "3840 × 2160"
                label_ru: "3840 × 2160"
              - value: "custom"
                label: "Custom"
                label_ru: "Свой"
          - &keep_png_kb_field
            id: keep_png_kb
            type: "number"
            group: "parameters"
            label: "Keep PNG under, KB"
            label_ru: "Не трогать PNG до, КБ"
            hint: "A PNG lighter than this stays a PNG, as it is: emblems, icons, elements, line drawings - as a JPEG they gain nothing and lose their sharp edges. A PNG that as a JPEG would weigh more stays too. 0 - off."
            hint_ru: "PNG легче этого остаётся PNG, как есть: гербы, пиктограммы, элементы, чертежи - в JPEG они ничего не выигрывают и теряют чёткие края. PNG, который в JPEG вышел бы тяжелее, тоже остаётся. 0 - выключено."
            default: 200
            min: 0
            max: 5000
            step: 50
          - id: max_width
            type: "number"
            group: "parameters"
            label: "Width, px"
            label_ru: "Ширина, px"
            hint: "Not less than 400."
            hint_ru: "Не меньше 400."
            required: true
            default: 1920
            min: 400
            max: 20000
            step: 100
            visible_if:
              field: "limit"
              equals: "custom"
          - id: max_height
            type: "number"
            group: "parameters"
            label: "Height, px"
            label_ru: "Высота, px"
            hint: "Not less than 400."
            hint_ru: "Не меньше 400."
            required: true
            default: 1080
            min: 400
            max: 20000
            step: 100
            visible_if:
              field: "limit"
              equals: "custom"
          - id: mode
            type: "radio"
            group: "parameters"
            label: "Mode"
            label_ru: "Режим"
            hint: "HARD: every raster picture over the limit is shrunk, a PNG becomes a JPEG (but for the light and the transparent ones). SAFE: only JPEGs are touched."
            hint_ru: "HARD: каждая растровая картинка больше предела уменьшается, PNG становится JPEG (кроме лёгких и прозрачных). SAFE: трогаются только JPEG."
            default: "hard"
            visible_if:
              field: "limit"
              equals: "custom"
            options:
              - value: "hard"
                label: "HARD"
                label_ru: "HARD"
              - value: "safe"
                label: "SAFE"
                label_ru: "SAFE"
          - id: min_skip_width
            type: "number"
            group: "parameters"
            label: "Small PNG: width"
            label_ru: "Мелкие PNG: ширина"
            hint: "A PNG up to this size stays as it is. 0 - the rule is off."
            hint_ru: "PNG до этого размера остаётся как есть. 0 - правило выключено."
            default: 400
            min: 0
            max: 4000
            step: 50
            visible_if:
              field: "limit"
              equals: "custom"
          - id: min_skip_height
            type: "number"
            group: "parameters"
            label: "Small PNG: height"
            label_ru: "Мелкие PNG: высота"
            hint: "A PNG up to this size stays as it is. 0 - the rule is off."
            hint_ru: "PNG до этого размера остаётся как есть. 0 - правило выключено."
            default: 400
            min: 0
            max: 4000
            step: 50
            visible_if:
              field: "limit"
              equals: "custom"
          - id: jpeg_quality
            type: "quality"
            group: "format"
            label: "JPEG quality"
            label_ru: "Качество JPEG"
            hint: "Lower - smaller. 82 is the balance of weight and look."
            hint_ru: "Меньше - легче. 82 - баланс веса и вида."
            default: 82
            options:
              - value: 75
                label: "75% quality"
                label_ru: "75% качества"
              - value: 82
                label: "82% quality"
                label_ru: "82% качества"
              - value: 90
                label: "90% quality"
                label_ru: "90% качества"
        parameters:
          fixed_args: ["docs-shrink"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--kinds": "kinds"
            "--limit": "limit"
            "--max-width": "max_width"
            "--max-height": "max_height"
            "--mode": "mode"
            "--min-skip-width": "min_skip_width"
            "--min-skip-height": "min_skip_height"
            "--keep-png-under-kb": "keep_png_kb"
            "--jpeg-quality": "jpeg_quality"
          defaults:
            input_path: "input"
            output_path: "output/docs_shrink"

      - id: docs_fit_size
        title: "Document to a file size"
        title_ru: "Документ под размер файла"
        description: "Fit every DOCX and PPTX of the Source under a size in megabytes. Its pictures go to JPEG - but for a PNG lighter than the barrier in KB - and the limit is lowered step by step - quality 75 and 1920 x 1080 first, then JPEG 65 down to 1280 x 720; a document that does not fit even then is named."
        description_ru: "Уложить каждый DOCX и PPTX источника в размер в мегабайтах. Картинки уходят в JPEG - кроме PNG легче барьера в КБ, - предел снижается по ступеням - сначала качество 75 и 1920 × 1080, затем JPEG 65 до 1280 × 720; документ, который не уложился и так, назван."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - *office_kinds_field
          - id: target_mb
            type: "number"
            group: "parameters"
            label: "Target size, MB"
            label_ru: "Целевой размер, МБ"
            default: 20
            min: 1
            max: 500
            step: 1
          - *keep_png_kb_field
        parameters:
          fixed_args: ["docs-fit-size"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--kinds": "kinds"
            "--target-mb": "target_mb"
            "--keep-png-under-kb": "keep_png_kb"
          defaults:
            input_path: "input"
            output_path: "output/docs_fit_size"

      - id: docs_color
        title: "Profile in documents"
        title_ru: "Профиль в документе"
        description: "Bring every picture of every DOCX and PPTX of the Source to sRGB or to CMYK, with the ICC profile written into the picture or without it."
        description_ru: "Привести каждую картинку каждого DOCX и PPTX источника к sRGB или CMYK - с профилем ICC внутри картинки или без него."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - *office_kinds_field
          - id: profile
            type: "radio"
            group: "parameters"
            label: "Profile"
            label_ru: "Профиль"
            default: "srgb"
            options:
              - value: "srgb"
                label: "sRGB"
                label_ru: "sRGB"
              - value: "cmyk"
                label: "CMYK"
                label_ru: "CMYK"
          - id: embed_icc
            type: "checkbox"
            group: "parameters"
            label: "Write the ICC profile into the pictures"
            label_ru: "Записать профиль ICC в картинки"
            default: false
        parameters:
          fixed_args: ["docs-color"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--kinds": "kinds"
            "--profile": "profile"
          flag_args:
            "--embed-icc": "embed_icc"
          defaults:
            input_path: "input"
            output_path: "output/docs_color"

      - id: docs_extract_media
        title: "Extract from DOCX and PPTX"
        title_ru: "Извлечь из DOCX и PPTX"
        description: "Copy the pictures of every DOCX and PPTX of the Source out, as they are stored, into a folder of the Target named after the document."
        description_ru: "Скопировать картинки каждого DOCX и PPTX источника такими, как они хранятся, в папку назначения с именем документа."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - *office_kinds_field
        parameters:
          fixed_args: ["docs-extract-media"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--kinds": "kinds"
          defaults:
            input_path: "input"
            output_path: "output/docs_extract_media"

      - id: pdf_dpi_check
        title: "Check DPI"
        title_ru: "Проверить DPI"
        description: "Read every PDF of the Source and write nothing into it: a line for every placed picture - its pixels, the size it is drawn at, the resolution that comes of it, the density it states - and the total of those below the threshold."
        description_ru: "Прочитать каждый PDF источника, ничего в него не записывая: строка на каждую картинку - пиксели, размер на странице, разрешение, которое из этого выходит, и число, которое картинка пишет о себе, - и итог: сколько ниже порога."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - *documents_threshold_field
          - *documents_threshold_custom_field
        parameters:
          fixed_args: ["docs-dpi-check", "--kinds", "pdf"]
          value_args:
            "--input": "input_path"
          composite_args: &documents_threshold_arg
            "--threshold":
              field: "threshold_preset"
              custom_if:
                field: "threshold_preset"
                equals: "custom"
              fields: ["threshold_custom"]
          defaults:
            input_path: "input"
            output_path: "output/pdf_dpi_check"

      - id: pdf_dpi_raise
        title: "Raise to DPI"
        title_ru: "Довести до DPI"
        description: "Write a copy of every PDF of the Source into the Target, its pictures at the threshold: only the streams of the pictures change, the pages, their text and the place of every picture stay. Every copy is checked by a second reader before it is called done; a signed or encrypted PDF is refused."
        description_ru: "Записать в назначение копию каждого PDF источника, картинки в ней - не ниже порога: меняются только потоки картинок, страницы, их текст и место каждой картинки остаются. Каждая копия проверяется вторым читателем, прежде чем названа готовой; PDF с подписью или шифром - отказ."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - *documents_threshold_field
          - *documents_threshold_custom_field
          - *documents_what_field
          - *documents_method_field
          - *documents_raise_quality_field
          - *documents_keep_lossless_field
        parameters:
          fixed_args: ["docs-dpi-raise", "--kinds", "pdf"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--what": "what"
            "--method": "method"
            "--jpeg-quality": "jpeg_quality"
          flag_args:
            "--keep-lossless": "keep_lossless"
          composite_args: *documents_threshold_arg
          defaults:
            input_path: "input"
            output_path: "output/pdf_dpi_raise"

      - id: pdf_shrink_images
        title: "Lighter pictures"
        title_ru: "Сжать картинки"
        description: "Write a copy of every PDF of the Source into the Target with lighter pictures: a picture drawn above the target resolution gets fewer pixels and is written as a JPEG; a palette, one bit to a pixel and a mask stay without loss. The pages, their text and the place of every picture stay; every copy is checked before it is called done."
        description_ru: "Записать в назначение копию каждого PDF источника с облегчёнными картинками: картинка с разрешением выше цели получает меньше пикселей и пишется в JPEG; палитра, один бит на пиксель и маска остаются без потерь. Страницы, их текст и место каждой картинки остаются; каждая копия проверяется, прежде чем названа готовой."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - id: target_preset
            type: "radio"
            group: "parameters"
            label: "Target, ppi"
            label_ru: "Цель, ppi"
            hint: "A picture above it gets fewer pixels, down to it; one at it or below stays as it is. 150 - for the screen, 200 - a document, 300 - print."
            hint_ru: "Картинка выше цели получает меньше пикселей, до цели; картинка на цели и ниже остаётся как есть. 150 - для экрана, 200 - документ, 300 - печать."
            default: "200"
            options:
              - value: "150"
                label: "150"
                label_ru: "150"
              - value: "200"
                label: "200"
                label_ru: "200"
              - value: "300"
                label: "300"
                label_ru: "300"
              - value: "custom"
                label: "Custom"
                label_ru: "Своя"
          - id: target_custom
            type: "number"
            group: "parameters"
            label: "Own target"
            label_ru: "Своя цель"
            required: true
            default: 250
            min: 50
            max: 1200
            step: 10
            visible_if:
              field: "target_preset"
              equals: "custom"
          - id: jpeg_quality
            type: "quality"
            group: "format"
            label: "JPEG quality"
            label_ru: "Качество JPEG"
            default: 82
            options:
              - value: 75
                label: "75% quality"
                label_ru: "75% качества"
              - value: 82
                label: "82% quality"
                label_ru: "82% качества"
              - value: 90
                label: "90% quality"
                label_ru: "90% качества"
          - *documents_keep_lossless_field
        parameters:
          fixed_args: ["docs-pdf-shrink"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--jpeg-quality": "jpeg_quality"
          flag_args:
            "--keep-lossless": "keep_lossless"
          composite_args:
            "--target-ppi":
              field: "target_preset"
              custom_if:
                field: "target_preset"
                equals: "custom"
              fields: ["target_custom"]
          defaults:
            input_path: "input"
            output_path: "output/pdf_shrink_images"

      - id: pdf_watermark
        title: "Watermark"
        title_ru: "Водяной знак"
        description: "Write a copy of every PDF of the Source into the Target with a line of text across every page, along its diagonal, half transparent. It is written as text over the page: the page is not drawn anew, its own text stays text. A signed or encrypted PDF is refused."
        description_ru: "Записать в назначение копию каждого PDF источника со строкой текста через каждую страницу, по её диагонали, полупрозрачной. Знак пишется текстом поверх страницы: страница не перерисовывается, её собственный текст остаётся текстом. PDF с подписью или шифром - отказ."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - id: text
            type: "text"
            group: "parameters"
            label: "Text"
            label_ru: "Текст"
            required: true
            default: "КОПИЯ"
          - id: opacity
            type: "number"
            group: "parameters"
            label: "Opacity, %"
            label_ru: "Непрозрачность, %"
            hint: "100 - opaque; 20-30 - the text of the page reads through the mark."
            hint_ru: "100 - непрозрачный; 20-30 - текст страницы читается сквозь знак."
            default: 25
            min: 5
            max: 100
            step: 5
          - id: coverage
            type: "number"
            group: "parameters"
            label: "Length, % of the diagonal"
            label_ru: "Длина, % диагонали"
            default: 70
            min: 20
            max: 100
            step: 5
          - id: color_mode
            type: "radio"
            group: "parameters"
            label: "Colour"
            label_ru: "Цвет"
            default: "red"
            options:
              - value: "red"
                label: "Red"
                label_ru: "Красный"
                swatch: "#cc0000"
              - value: "grey"
                label: "Grey"
                label_ru: "Серый"
                swatch: "#666666"
              - value: "black"
                label: "Black"
                label_ru: "Чёрный"
                swatch: "#000000"
              - value: "blue"
                label: "Blue"
                label_ru: "Синий"
                swatch: "#0066cc"
              - value: "custom"
                label: "Custom"
                label_ru: "Свой"
          - id: custom_rgb
            type: "rgb_color"
            group: "parameters"
            label: "Own colour"
            label_ru: "Свой цвет"
            visible_if:
              field: "color_mode"
              equals: "custom"
        parameters:
          fixed_args: ["docs-pdf-watermark"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--text": "text"
            "--opacity": "opacity"
            "--coverage": "coverage"
          composite_args:
            "--color":
              field: "color_mode"
              custom_if:
                field: "color_mode"
                equals: "custom"
              fields: ["mark_r", "mark_g", "mark_b"]
              separator: ","
          defaults:
            input_path: "input"
            output_path: "output/pdf_watermark"

  - id: pdf
    title: "PDF"
    title_ru: "PDF"
    description: "PDF image workflows: render pages to raster files, extract embedded images, or assemble a PDF from prepared images."
    description_ru: "PDF-сценарии для изображений: отрендерить страницы в растры, извлечь встроенные картинки или собрать PDF из подготовленных изображений."
    fields: *module_io_fields
    children:
      - id: pdf_export
        title: "PDF export"
        title_ru: "Экспорт страниц PDF"
        description: "Export PDF pages by embedded or render mode."
        description_ru: "Экспортировать страницы PDF через встроенные растры или рендеринг."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: mode
            type: "radio"
            group: "parameters"
            label: "Mode"
            label_ru: "Режим"
            default: "embedded"
            options:
              - value: "embedded"
                label: "Embedded"
                label_ru: "Встроенные растры"
              - value: "render"
                label: "Render"
                label_ru: "Рендеринг"
          - id: dpi
            type: "number"
            group: "output"
            label: "Render DPI"
            label_ru: "DPI рендеринга"
            hint: "Used in Render mode. Embedded mode keeps source pixels."
            hint_ru: "Используется для рендеринга. Режим встроенных растров берёт исходные пиксели."
            disabled_if:
              field: "mode"
              not_equals: "render"
            default: 300
            min: 1
            max: 1200
            step: 1
          - id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "png"
            options: *delivery_format_options
          - *quality_field_90
        parameters:
          fixed_args: ["pdf-export"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
            "--mode": "mode"
            "--dpi": "dpi"
          defaults:
            input_path: "input"
            output_path: "output/pdf_export"

      - id: pdf_extract
        title: "Extract embedded"
        title_ru: "Извлечь из PDF"
        description: "Extract embedded raster images from PDF."
        description_ru: "Извлечь встроенные растры из PDF."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: to
            type: "checkboxes"
            group: "format"
            label: "Output formats"
            label_ru: "Форматы вывода"
            default: ["original"]
            min_selected: 1
            options: *extract_format_options
          - *quality_field_90
          - id: layout
            type: "radio"
            group: "output"
            label: "Layout"
            label_ru: "Раскладка"
            default: "flat"
            options:
              - value: "flat"
                label: "One folder"
                label_ru: "В одну папку"
              - value: "folders"
                label: "PDF-name folders"
                label_ru: "По папкам имён PDF"
          - id: png_side_tiff
            type: "checkbox"
            group: "options"
            label: "PNG side TIFF"
            label_ru: "TIFF рядом с PNG"
            hint: "For PNG output: also write TIFF when the embedded image is CMYK or has ICC."
            hint_ru: "Для PNG: дополнительно пишет TIFF, если встроенная картинка CMYK или содержит ICC."
            disabled_if:
              field: "to"
              not_contains: "png"
            default: true
        parameters:
          fixed_args: ["pdf-extract-embedded"]
          multi_field: "to"
          multi_output_key: "output_path"
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--layout": "layout"
            "--jpeg-quality": "jpeg_quality"
            "--png-side-tiff": "png_side_tiff"
          defaults:
            input_path: "input"
            output_path: "output/pdf_embedded_images"
            jpeg_quality: 90

      - id: images_to_pdf
        title: "Images to PDF"
        title_ru: "Картинки в PDF"
        description: "Build PDF from input images."
        description_ru: "Собрать PDF из изображений input."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: bundle
            type: "radio"
            group: "output"
            label: "Build"
            label_ru: "Сборка"
            default: "folders"
            options:
              - value: "all"
                label: "All images into one PDF"
                label_ru: "Все картинки в один PDF"
              - value: "folders"
                label: "Separate PDFs by folder"
                label_ru: "В несколько PDF"
          - id: preserve_dpi
            type: "checkbox"
            group: "output"
            label: "Do not change DPI"
            label_ru: "Не менять DPI"
            hint: "Keep source image DPI metadata for PDF page size."
            hint_ru: "Использовать DPI исходных картинок для физического размера страниц PDF."
            default: true
          - id: mode
            type: "radio"
            group: "format"
            label: "PDF mode"
            label_ru: "PDF режим"
            default: "lossless"
            options:
              - value: "lossless"
                label: "PNG lossless"
                label_ru: "PNG без потерь"
              - value: "jpg75"
                label: "JPG 75% quality"
                label_ru: "JPG 75% качества"
              - value: "jpg90"
                label: "JPG 90% quality"
                label_ru: "JPG 90% качества"
          - id: dpi
            type: "number"
            group: "output"
            label: "PDF DPI"
            label_ru: "Свой DPI"
            hint: "Used only when Do not change DPI is off. This changes PDF physical page size, not pixels."
            hint_ru: "Используется только если выключено «Не менять DPI». Меняет физический размер страниц PDF, не пиксели."
            disabled_if:
              field: "preserve_dpi"
              equals: true
            default: ""
            min: 1
            max: 1200
            step: 1
        parameters:
          fixed_args: ["images-to-pdf"]
          value_args:
            "--input": "input_path"
            "--output": "output_file"
            "--mode": "mode"
            "--bundle": "bundle"
            "--dpi": "dpi"
          defaults:
            input_path: "input"
            output_file: "output/images.pdf"
          ui_only_fields: ["preserve_dpi"]

      - id: pdf_rotate_pages
        title: "Turn pages"
        title_ru: "Повернуть страницы"
        description: "Write a copy of every PDF of the Source into the Target with the pages asked for turned. Only the turn of a page is written - the page is not drawn anew, its text stays text, its pictures keep every pixel. A signed or encrypted PDF is refused."
        description_ru: "Записать в назначение копию каждого PDF источника, повернув указанные страницы. Пишется только поворот страницы - она не перерисовывается, текст остаётся текстом, картинки сохраняют каждый пиксель. PDF с подписью или шифром - отказ."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - id: turn
            type: "radio"
            group: "parameters"
            label: "Turn"
            label_ru: "Поворот"
            default: "cw90"
            options:
              - value: "cw90"
                label: "90° clockwise"
                label_ru: "90° по часовой"
              - value: "ccw90"
                label: "90° counter-clockwise"
                label_ru: "90° против"
              - value: "180"
                label: "Turn 180°"
                label_ru: "Развернуть на 180°"
          - id: pages
            type: "text"
            group: "parameters"
            label: "Pages"
            label_ru: "Страницы"
            hint: "1-3, 5, 8- ; empty - every page."
            hint_ru: "1-3, 5, 8- ; пусто - все страницы."
            default: ""
        parameters:
          fixed_args: ["docs-pdf-rotate"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--turn": "turn"
            "--pages": "pages"
          defaults:
            input_path: "input"
            output_path: "output/pdf_rotate_pages"

      - id: pdf_merge
        title: "Merge PDF"
        title_ru: "Собрать PDF"
        description: "Put every PDF of the Source into one file in the Target, in the order of their names (2 before 10). The pages are carried as they are - nothing is drawn anew. Bookmarks of the documents are not carried."
        description_ru: "Собрать все PDF источника в один файл в назначении, в порядке имён (2 раньше 10). Страницы переносятся как есть - ничего не перерисовывается. Закладки документов не переносятся."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - id: name
            type: "text"
            group: "parameters"
            label: "Name of the file"
            label_ru: "Имя файла"
            required: true
            default: "merged"
        parameters:
          fixed_args: ["docs-pdf-merge"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--name": "name"
          defaults:
            input_path: "input"
            output_path: "output/pdf_merge"

      - id: pdf_split
        title: "Split PDF"
        title_ru: "Разделить PDF"
        description: "Part every PDF of the Source into files in the Target: one a page, one every N pages, or one a range. The pages are carried as they are - nothing is drawn anew; the files are named name_001.pdf, name_002.pdf."
        description_ru: "Разделить каждый PDF источника на файлы в назначении: по одной странице, по N страниц или по диапазонам. Страницы переносятся как есть - ничего не перерисовывается; файлы называются имя_001.pdf, имя_002.pdf."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        fields:
          - id: mode
            type: "radio"
            group: "parameters"
            label: "Split"
            label_ru: "Делить"
            default: "each"
            options:
              - value: "each"
                label: "By page"
                label_ru: "По странице"
              - value: "every"
                label: "Every N pages"
                label_ru: "По N страниц"
              - value: "ranges"
                label: "By ranges"
                label_ru: "По диапазонам"
          - id: every
            type: "number"
            group: "parameters"
            label: "Pages a file"
            label_ru: "Страниц в файле"
            default: 10
            min: 2
            max: 1000
            step: 1
            visible_if:
              field: "mode"
              equals: "every"
          - id: ranges
            type: "text"
            group: "parameters"
            label: "Ranges"
            label_ru: "Диапазоны"
            hint: "A file a range: 1-3, 4-10, 11-"
            hint_ru: "Файл на диапазон: 1-3, 4-10, 11-"
            default: ""
            visible_if:
              field: "mode"
              equals: "ranges"
        parameters:
          fixed_args: ["docs-pdf-split"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--mode": "mode"
            "--every": "every"
            "--ranges": "ranges"
          defaults:
            input_path: "input"
            output_path: "output/pdf_split"

      - id: quick_pdf_clean_meta
        title: "No PDF properties"
        title_ru: "Без свойств PDF"
        description: "Write a copy of every PDF of the Source into the Target without the properties of the document: author, title, the program that made it, dates, XMP. The pages are not touched. A signed or encrypted PDF is refused."
        description_ru: "Записать в назначение копию каждого PDF источника без свойств документа: автора, названия, программы, дат, XMP. Страницы не трогаются. PDF с подписью или шифром - отказ."
        service: "system_core.services.image_tools_gui:run_documents_cli"
        kind: "safe"
        parameters:
          fixed_args: ["docs-pdf-clean-meta"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
          defaults:
            input_path: "input"
            output_path: "output/pdf_clean_meta"

  - id: sheets_and_marks
    title: "Sheets and marks"
    title_ru: "Листы и метки"
    description: "Production sheet helpers: tile labels, make overview/contact layouts, add text watermarks, and split multipage TIFF files."
    description_ru: "Помощники для производственных листов: разложить наклейки, собрать обзорные/контактные раскладки, добавить водяной знак и разделить многостраничный TIFF."
    fields: *module_io_fields
    children:
      - id: tile_sheet
        title: "Tile sheet"
        title_ru: "Замостить лист"
        description: "Repeat one image across A5/A4/A3 or a custom-width roll."
        description_ru: "Размножить одно изображение на A5/A4/A3 или рулон заданной ширины."
        service: "system_core.services.image_tools_gui:run_tile_sheet"
        kind: "safe"
        fields:
          - id: paper
            type: "radio"
            group: "format"
            label: "Paper"
            label_ru: "Бумага"
            default: "a4"
            options:
              - value: "a5"
                label: "A5"
                label_ru: "A5"
              - value: "a4"
                label: "A4"
                label_ru: "A4"
              - value: "a3"
                label: "A3"
                label_ru: "A3"
              - value: "roll"
                label: "Roll"
                label_ru: "Рулон"
          - id: orientation
            type: "radio"
            group: "format"
            label: "Orientation"
            label_ru: "Ориентация"
            default: "portrait"
            visible_if:
              field: "paper"
              not_equals: "roll"
              default: "a4"
            options:
              - value: "portrait"
                label: "Portrait"
                label_ru: "Портрет"
              - value: "landscape"
                label: "Landscape"
                label_ru: "Альбом"
          - id: margin_mm
            type: "float"
            group: "parameters"
            label: "Margin, mm"
            label_ru: "Поля, мм"
            default: 7
            min: 0
            max: 100
            step: 0.5
          - id: gap_mm
            type: "float"
            group: "parameters"
            label: "Gap, mm"
            label_ru: "Зазор, мм"
            default: 0
            min: 0
            max: 50
            step: 0.5
          - id: dpi
            type: "number"
            group: "format"
            label: "DPI"
            label_ru: "DPI"
            default: 300
            min: 72
            max: 1200
            step: 1
          - id: to
            type: "radio"
            group: "format"
            label: "Output"
            label_ru: "Вывод"
            default: "tiff"
            options:
              - value: "tiff"
                label: "TIFF"
                label_ru: "TIFF"
              - value: "png"
                label: "PNG"
                label_ru: "PNG"
          - id: size_mode
            type: "radio"
            group: "parameters"
            label: "Sticker size"
            label_ru: "Размер наклейки"
            default: "source"
            options:
              - value: "source"
                label: "As is"
                label_ru: "Как есть"
              - value: "width"
                label: "By width"
                label_ru: "По ширине"
              - value: "height"
                label: "By height"
                label_ru: "По высоте"
              - value: "doc-40x30"
                label: "Document 40x30"
                label_ru: "Документ 40x30"
              - value: "doc-60x40"
                label: "Document 60x40"
                label_ru: "Документ 60x40"
          - id: item_width_mm
            type: "float"
            group: "parameters"
            label: "Width, mm"
            label_ru: "Ширина, мм"
            default: 40
            min: 1
            max: 1000
            step: 0.5
          - id: item_height_mm
            type: "float"
            group: "parameters"
            label: "Height, mm"
            label_ru: "Высота, мм"
            default: 30
            min: 1
            max: 1000
            step: 0.5
          - id: box_fit
            type: "radio"
            group: "parameters"
            label: "Preset fit"
            label_ru: "Вписывание пресета"
            default: "contain"
            options:
              - value: "contain"
                label: "No crop"
                label_ru: "Без обрезки"
              - value: "crop"
                label: "Crop to box"
                label_ru: "Обрезать в рамку"
          - id: count_mode
            type: "radio"
            group: "options"
            label: "Count"
            label_ru: "Количество"
            default: "fill"
            visible_if:
              field: "paper"
              not_equals: "roll"
              default: "a4"
            options:
              - value: "fill"
                label: "Fill sheet"
                label_ru: "Заполнить лист"
              - value: "copies"
                label: "Exact copies"
                label_ru: "Точно копий"
              - value: "rows"
                label: "Exact rows"
                label_ru: "Точно рядов"
          - id: roll_count_mode
            type: "radio"
            group: "options"
            label: "Roll count"
            label_ru: "Количество на рулоне"
            default: "rows"
            visible_if:
              field: "paper"
              equals: "roll"
              default: "a4"
            options:
              - value: "copies"
                label: "Exact copies"
                label_ru: "Точно копий"
              - value: "rows"
                label: "Exact rows"
                label_ru: "Точно рядов"
          - id: copies
            type: "number"
            group: "options"
            label: "Copies"
            label_ru: "Копий"
            default: 24
            min: 0
            max: 10000
            step: 1
            visible_if_any:
              - all:
                  - field: "paper"
                    not_equals: "roll"
                    default: "a4"
                  - field: "count_mode"
                    equals: "copies"
                    default: "fill"
              - all:
                  - field: "paper"
                    equals: "roll"
                    default: "a4"
                  - field: "roll_count_mode"
                    equals: "copies"
                    default: "rows"
          - id: rows
            type: "number"
            group: "options"
            label: "Rows"
            label_ru: "Рядов"
            default: 1
            min: 0
            max: 1000
            step: 1
            visible_if_any:
              - all:
                  - field: "paper"
                    not_equals: "roll"
                    default: "a4"
                  - field: "count_mode"
                    equals: "rows"
                    default: "fill"
              - all:
                  - field: "paper"
                    equals: "roll"
                    default: "a4"
                  - field: "roll_count_mode"
                    equals: "rows"
                    default: "rows"
          - id: roll_width_mm
            type: "float"
            group: "options"
            label: "Roll width, mm"
            label_ru: "Ширина рулона, мм"
            default: 600
            min: 1
            max: 5000
            step: 1
            visible_if:
              field: "paper"
              equals: "roll"
              default: "a4"
          - id: frame_mm
            type: "float"
            group: "options"
            label: "Frame, mm"
            label_ru: "Рамка, мм"
            default: 0.2
            min: 0
            max: 10
            step: 0.1
          - id: frame_color
            type: "text"
            group: "options"
            label: "Frame color"
            label_ru: "Цвет рамки"
            default: "#999999"
          - id: background
            type: "text"
            group: "options"
            label: "Background"
            label_ru: "Фон"
            default: "white"
        parameters:
          defaults:
            input_path: "input"
            output_path: "output/tile_sheet"

      - id: split_tiff
        title: "Split into frames"
        title_ru: "Разделить на кадры"
        description: "Take every picture of the Source of more than one frame apart into PNG frames, without loss: a TIFF of many pages, an animated GIF, WebP or APNG, an MPO. The frames of a picture go into a folder of its name - 001_name.png, 002_name.png; an animation leaves frames.json with its pauses, and Animation from frames puts it back together."
        description_ru: "Разобрать каждую картинку источника из нескольких кадров на PNG-кадры без потерь: многостраничный TIFF, анимированный GIF, WebP или APNG, MPO. Кадры картинки ложатся в папку её имени - 001_имя.png, 002_имя.png; анимация оставляет frames.json со своими паузами, и «Анимация из кадров» собирает её обратно."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        parameters:
          fixed_args: ["split-frames"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
          defaults:
            input_path: "input"
            output_path: "output/frames"

      - id: watermark
        title: "Watermark"
        title_ru: "Водяной знак"
        description: "Add a corner text watermark or a diagonal protective watermark."
        description_ru: "Добавить текстовый водяной знак в углу или диагональную защитную надпись."
        service: "system_core.services.image_tools_gui:run_manifest_cli"
        kind: "safe"
        fields:
          - id: text
            type: "text"
            group: "parameters"
            label: "Watermark text"
            label_ru: "Текст водяного знака"
            default: ""
            required: true
          - id: watermark_mode
            type: "radio"
            group: "parameters"
            label: "Mode"
            label_ru: "Режим"
            hint: "Corner mode adds a normal horizontal label in the selected corner. Diagonal protective mode centers the text across the image diagonal and scales it to the selected diagonal coverage."
            hint_ru: "Режим в углу добавляет обычную горизонтальную подпись в выбранном углу. Диагональный защитный режим ставит текст по центру диагонали и масштабирует его по выбранному покрытию диагонали."
            default: "corner"
            choice_style: "segmented"
            span: "full"
            options:
              - value: "corner"
                label: "Corner"
                label_ru: "В углу"
              - value: "diagonal"
                label: "Diagonal protective"
                label_ru: "Диагональный защитный"
          - id: position
            type: "radio"
            group: "parameters"
            label: "Position"
            label_ru: "Позиция"
            hint: "Used only in Corner mode."
            hint_ru: "Используется только в режиме «В углу»."
            default: "bottom-right"
            visible_if:
              field: "watermark_mode"
              equals: "corner"
            options:
              - value: "bottom-right"
                label: "Bottom right"
                label_ru: "Снизу справа"
              - value: "bottom-left"
                label: "Bottom left"
                label_ru: "Снизу слева"
              - value: "top-right"
                label: "Top right"
                label_ru: "Сверху справа"
              - value: "top-left"
                label: "Top left"
                label_ru: "Сверху слева"
          - id: diagonal_coverage
            type: "float"
            group: "parameters"
            label: "Diagonal coverage, %"
            label_ru: "Длина по диагонали, %"
            hint: "Used only in Diagonal protective mode. 60 means the watermark text is fitted to about 60% of the full image diagonal, leaving room for short large words such as COPY."
            hint_ru: "Используется только в диагональном защитном режиме. Значение 60 означает, что текст подгоняется примерно под 60% полной диагонали изображения и оставляет воздух для коротких крупных слов вроде «КОПИЯ»."
            default: 60
            min: 5
            max: 150
            step: 5
            visible_if:
              field: "watermark_mode"
              equals: "diagonal"
          - id: margin
            type: "number"
            group: "parameters"
            label: "Corner margin, px"
            label_ru: "Отступ от угла, px"
            hint: "Used only in Corner mode."
            hint_ru: "Используется только в режиме «В углу»."
            default: 32
            min: 0
            max: 5000
            step: 1
            visible_if:
              field: "watermark_mode"
              equals: "corner"
          - id: font_size
            type: "number"
            group: "parameters"
            label: "Corner font size"
            label_ru: "Кегль в углу"
            hint: "Used only in Corner mode. Watermarks use Arial Bold when available. Diagonal protective mode chooses the font size automatically from the diagonal coverage."
            hint_ru: "Используется только в режиме «В углу». Водяной знак использует Arial Bold, если шрифт доступен. Диагональный защитный режим подбирает размер шрифта автоматически по длине диагонали."
            default: 36
            min: 1
            max: 1000
            step: 1
            visible_if:
              field: "watermark_mode"
              equals: "corner"
          - id: opacity
            type: "number"
            group: "parameters"
            label: "Opacity"
            label_ru: "Прозрачность"
            hint: "Alpha channel for the watermark: 0 is invisible, 255 is fully opaque. Default 64 is about 25% opacity and is chosen for print, where marks usually look darker than on screen."
            hint_ru: "Альфа-канал водяного знака: 0 — невидимый, 255 — полностью непрозрачный. Дефолт 64 — около 25% непрозрачности; он выбран под печать, где знаки обычно выглядят темнее, чем на экране."
            default: 64
            min: 0
            max: 255
            step: 5
          - id: color_mode
            type: "radio"
            group: "parameters"
            label: "Color"
            label_ru: "Цвет"
            hint: "Color presets with visible swatches. Choose Custom RGB to enter exact Red, Green, and Blue values."
            hint_ru: "Цветовые пресеты с видимыми плашками. Выберите «Свой RGB», чтобы вручную задать красный, зелёный и синий каналы."
            default: "#cc0000"
            choice_style: "chips"
            span: "full"
            options:
              - value: "#cc0000"
                label: "Red"
                label_ru: "Красный"
                swatch: "#cc0000"
              - value: "#000000"
                label: "Black"
                label_ru: "Чёрный"
                swatch: "#000000"
              - value: "#ffffff"
                label: "White"
                label_ru: "Белый"
                swatch: "#ffffff"
              - value: "#ffcc00"
                label: "Yellow"
                label_ru: "Жёлтый"
                swatch: "#ffcc00"
              - value: "#666666"
                label: "Gray"
                label_ru: "Серый"
                swatch: "#666666"
              - value: "#0066cc"
                label: "Blue"
                label_ru: "Синий"
                swatch: "#0066cc"
              - value: "custom"
                label: "Custom RGB"
                label_ru: "Свой RGB"
                swatch: "linear-gradient(90deg, #cc0000, #00aa44, #0066cc)"
          - id: custom_rgb
            type: "rgb_color"
            group: "parameters"
            label: "Custom RGB"
            label_ru: "Свой RGB"
            hint: "Live color patch and exact Red, Green, Blue channels, 0..255. The value is passed to the engine as R,G,B."
            hint_ru: "Живой цветовой патч и точные каналы Red, Green, Blue, 0..255. В движок значение передаётся как R,G,B."
            span: "full"
            visible_if:
              field: "color_mode"
              equals: "custom"
          - id: to
            type: "radio"
            group: "format"
            label: "Output format"
            label_ru: "Формат вывода"
            default: "png"
            options: *delivery_format_options
          - *quality_field_75
        parameters:
          fixed_args: ["watermark"]
          value_args:
            "--input": "input_path"
            "--output": "output_path"
            "--to": "to"
            "--jpeg-quality": "jpeg_quality"
            "--text": "text"
            "--watermark-mode": "watermark_mode"
            "--position": "position"
            "--diagonal-coverage": "diagonal_coverage"
            "--margin": "margin"
            "--opacity": "opacity"
            "--font-size": "font_size"
          composite_args:
            "--color":
              field: "color_mode"
              custom_if:
                field: "color_mode"
                equals: "custom"
              fields: ["color_r", "color_g", "color_b"]
              separator: ","
          defaults:
            input_path: "input"
            output_path: "output/watermark"
            color_r: 204
            color_g: 0
            color_b: 0
          ui_only_fields: ["custom_rgb"]


  - id: contact_sheet
    title: "Contact sheet"
    title_ru: "Контактный лист"
    description: "Build visual proof sheets for checking a folder at a glance: thumbnails with KB, pixels, centimeters, DPI, output format and quality."
    description_ru: "Собрать контрольный лист для быстрой проверки папки: превью с KB, пикселями, сантиметрами, DPI, форматом вывода и качеством."
    service: "system_core.services.image_tools_gui:run_manifest_cli"
    kind: "safe"
    fields:
      - id: input_path
        type: "folder"
        group: "source"
        label: "SOURCE"
        label_ru: "ИСТОЧНИК"
        hint: "Optional. Leave empty to use the command default input folder."
        hint_ru: "Необязательно. Оставь пустым, чтобы использовать стандартную папку input для команды."
        placeholder: "input"
        default: ""
        omit_if_empty: true
      - id: output_path
        type: "folder"
        group: "output"
        label: "DESTINATION"
        label_ru: "ПРИЁМНИК"
        hint: "Optional. Leave empty to use the command default output folder."
        hint_ru: "Необязательно. Оставь пустым, чтобы использовать стандартную папку output для команды."
        placeholder: "output"
        default: ""
        omit_if_empty: true
        show_new_folder_button: true
      - id: columns
        type: "number"
        group: "parameters"
        label: "Columns"
        label_ru: "Колонки"
        default: 4
        min: 1
        max: 20
        step: 1
      - id: thumb_size_mode
        type: "radio"
        group: "thumbnail"
        label: "Size mode"
        label_ru: "Режим размера"
        default: "preset"
        options:
          - value: "preset"
            label: "List"
            label_ru: "Из списка"
          - value: "custom"
            label: "Custom"
            label_ru: "Свой размер"
      - id: thumb_preset
        type: "select"
        group: "thumbnail"
        label: "Thumb size"
        label_ru: "Размер миниатюры"
        visible_if:
          field: "thumb_size_mode"
          equals: "preset"
        default: "640x480"
        options:
          - value: "320x240"
            label: "320x240"
            label_ru: "320x240"
          - value: "480x360"
            label: "480x360"
            label_ru: "480x360"
          - value: "640x480"
            label: "640x480"
            label_ru: "640x480"
          - value: "800x600"
            label: "800x600"
            label_ru: "800x600"
          - value: "1024x768"
            label: "1024x768"
            label_ru: "1024x768"
          - value: "1280x720"
            label: "1280x720"
            label_ru: "1280x720"
          - value: "1280x960"
            label: "1280x960"
            label_ru: "1280x960"
          - value: "1600x900"
            label: "1600x900"
            label_ru: "1600x900"
          - value: "1920x1080"
            label: "1920x1080"
            label_ru: "1920x1080"
      - id: thumb_width
        type: "number"
        group: "thumbnail"
        label: "Thumb width"
        label_ru: "Ширина миниатюры"
        visible_if:
          field: "thumb_size_mode"
          equals: "custom"
        default: 640
        min: 1
        max: 10000
        step: 1
      - id: thumb_height
        type: "number"
        group: "thumbnail"
        label: "Thumb height"
        label_ru: "Высота миниатюры"
        visible_if:
          field: "thumb_size_mode"
          equals: "custom"
        default: 480
        min: 1
        max: 10000
        step: 1
      - id: to
        type: "radio"
        group: "format"
        label: "Output format"
        label_ru: "Формат вывода"
        default: "png"
        options: *delivery_format_options
      - *quality_field_92
    parameters:
      fixed_args: ["contact-sheet"]
      value_args:
        "--input": "input_path"
        "--output": "output_file"
        "--to": "to"
        "--jpeg-quality": "jpeg_quality"
        "--columns": "columns"
      composite_args:
        "--thumb-size":
          field: "thumb_preset"
          manual_if:
            field: "thumb_size_mode"
            equals: "custom"
          fields: ["thumb_width", "thumb_height"]
          separator: "x"
      defaults:
        input_path: "input"
        output_file: "output/contact_sheet.png"

